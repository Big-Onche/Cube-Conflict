////////////////////////////////////////////////
//
// particle shaders
//
////////////////////////////////////////////////

// wobbles the vertices of an explosion sphere
// and generates all texcoords 
// and blends the edge color
// and modulates the texture
explosionshader = [
    shader 0 $arg1 [
        //:fog
        attribute vec4 vvertex, vcolor;
        uniform mat4 explosionmatrix;
        uniform vec3 center;
        uniform float millis;
        attribute vec2 vtexcoord0;
        uniform vec4 texgenS, texgenT;
        @(? (>= (strstr $arg1 "soft") 0) [
            uniform vec2 lineardepthscale;
            varying float lineardepth;
        ])
        varying vec4 color;
        varying vec2 texcoord0, texcoord1, texcoord2;
        void main(void)
        {
            vec4 wobble = vec4(vvertex.xyz*(1.0 + 0.5*abs(fract(dot(vvertex.xyz, center) + millis*2.0) - 0.5)), vvertex.w);
            gl_Position = explosionmatrix * wobble;
            @(? (>= (strstr $arg1 "soft") 0) [
                lineardepth = dot(lineardepthscale, gl_Position.zw);
            ])

            color = vcolor;

            texcoord0 = vtexcoord0; 
            vec2 texgen = vec2(dot(texgenS, vvertex), dot(texgenT, vvertex)); 
            texcoord1 = texgen;
            texcoord2 = 0.5*texgen - millis*0.5;
        }
    ] [
        @(if (>= (strstr $arg1 "soft") 0) [result [
            @(gfetchdefs tex2)
            uniform vec3 softparams;
            varying float lineardepth;
        ]])
        varying vec4 color;
        varying vec2 texcoord0, texcoord1, texcoord2;
        uniform sampler2D tex0;
        uniform vec2 blendparams;
        fragdata(0) vec4 fragcolor;
        void main(void)
        {
            vec2 dtc = texcoord0 + texture2D(tex0, texcoord2).xy*0.1; // use color texture as noise to distort texcoords
            vec4 diffuse = texture2D(tex0, dtc);
            float blend = max(pow(clamp(1.0 - dot(texcoord1, texcoord1), 0.0, 1.0), blendparams.x), blendparams.y);
            diffuse *= blend*4.0; // dup alpha into RGB channels + intensify and over saturate
            diffuse.b += 0.5 - blend*0.5; // blue tint 

            @(if (>= (strstr $arg1 "soft") 0) [result [
                fragcolor.rgb = diffuse.rgb * color.rgb;

                @(gdepthunpack depth [gfetch(tex2, gl_FragCoord.xy)])
                fragcolor.a = diffuse.a * max(clamp((depth - lineardepth)*softparams.x - softparams.y, 0.0, 1.0) * color.a, softparams.z);
            ]] [result [
                fragcolor = diffuse * color;
            ]])
        }
    ]
]

explosionshader "explosion"
explosionshader "explosionsoft"

shader 0 "particlenotexture" [
    //:fog
    attribute vec4 vvertex, vcolor;
    uniform mat4 camprojmatrix;
    uniform vec4 colorscale;
    varying vec4 color;
    void main(void)
    {
        gl_Position = camprojmatrix * vvertex;
        color = vcolor * colorscale;
    }
] [
    varying vec4 color;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        fragcolor = color;
    }
]

shader 0 "particletext" [
    //:fog
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 camprojmatrix;
    uniform float ldrscale;
    varying vec4 color;
    varying vec2 texcoord0;
    void main(void)
    {
        gl_Position = camprojmatrix * vvertex;
        texcoord0 = vtexcoord0;
        color = vec4(vcolor.rgb * ldrscale, vcolor.a);
    }
] [
    uniform vec4 textparams;
    uniform sampler2D tex0;
    varying vec4 color;
    varying vec2 texcoord0;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        float dist = texture2D(tex0, texcoord0).r;
        float border = smoothstep(textparams.x, textparams.y, dist);
        float outline = smoothstep(textparams.z, textparams.w, dist);
        fragcolor = vec4(color.rgb * outline, color.a * border);
    }
]

particleshader = [
    shader 0 $arg1 [
        //:fog
        attribute vec4 vvertex, vcolor;
        attribute vec2 vtexcoord0;
        uniform mat4 camprojmatrix;
        uniform vec4 colorscale;
        varying vec4 color;
        varying vec2 texcoord0;
        @(? (>= (strstr $arg1 "soft") 0) [
            uniform vec2 lineardepthscale;
            varying float lineardepth;
            varying vec2 surface;
        ])
        void main(void)
        {
            gl_Position = camprojmatrix * vvertex;
            texcoord0 = vtexcoord0; 
            color = vcolor * colorscale; 

            @(? (>= (strstr $arg1 "soft") 0) [
                lineardepth = dot(lineardepthscale, gl_Position.zw);
                surface = vtexcoord0.xy*2.82842712474619 - 1.4142135623731;
            ])
        }
    ] [
        @(if (>= (strstr $arg1 "soft") 0) [result [
            @(gfetchdefs tex2)
            uniform vec3 softparams;
            varying float lineardepth;
            varying vec2 surface;
        ]])
        uniform sampler2D tex0;
        varying vec4 color;
        varying vec2 texcoord0;
        fragdata(0) vec4 fragcolor;
        void main(void)
        {
			vec4 diffuse = texture2D(tex0, texcoord0);

            @(if (>= (strstr $arg1 "soft") 0) [result [
                @(gdepthunpack depth [gfetch(tex2, gl_FragCoord.xy)])
                diffuse.a *= clamp((depth - lineardepth)*softparams.x - softparams.y - dot(surface, surface), 0.0, 1.0);
            ]])

            fragcolor = diffuse * color;
        }
    ]
]

particleshader "particle"
particleshader "particlesoft"

gpuparticlevertexdefs = [
    attribute vec4 vvertex, vcolor;
    attribute vec4 vtexcoord0, vtexcoord1, vnormal;
    uniform vec4 gpuparticleparams;  // x = current millis, y = game speed, z = soft-particle distance
    uniform vec4 gpuparticleoptions; // x = random atlas, y = rotation, z = modulate blend
    uniform vec4 colorscale;
    uniform vec3 particlebillboardright, particlebillboardup, particlebillboarddir;
    uniform vec3 camera;

    float gpuflag(float flags, float divisor)
    {
        return mod(floor(flags / divisor), 2.0);
    }

    void getgpuparticlebase(out vec3 center, out float size, out vec2 texcoord, out vec2 particlecoord,
                            out vec2 billboardcoord, out vec4 particlecolor)
    {
        float age = max(gpuparticleparams.x - vnormal.x, 0.0);
        float fade = vnormal.y;
        float alive = fade <= 5.0 ? 1.0 - step(0.5, age) : step(age, fade);
        float blend = fade <= 5.0 ? 1.0 : clamp(1.0 - age / max(fade, 1.0), 0.0, 1.0);
        blend = min(blend * 4.0, 1.0);
        float motionage = fade <= 5.0 ? 0.0 : min(age, fade);

        center = vtexcoord0.xyz + vtexcoord1.xyz * (motionage / 5000.0);
        if(abs(vtexcoord1.w) > 1.0e-5) center.z -= motionage * motionage / (2.0 * 5000.0 * vtexcoord1.w);

        size = max(vtexcoord0.w + vnormal.z * gpuparticleparams.y * motionage / 100000.0, 0.0) * alive;
        vec2 corner = vvertex.xy;
        if(gpuparticleoptions.y > 0.5)
        {
            float angle = floor(mod(vnormal.w / 4.0, 32.0)) * 0.196349540849362;
            float c = cos(angle), s = sin(angle);
            corner = vec2(corner.x*c - corner.y*s, corner.x*s + corner.y*c);
        }
        particlecoord = vvertex.xy;
        billboardcoord = corner;

        texcoord = vec2(vvertex.x * 0.5 + 0.5, 0.5 - vvertex.y * 0.5);
        if(gpuflag(vnormal.w, 1.0) > 0.5) texcoord.x = 1.0 - texcoord.x;
        if(gpuflag(vnormal.w, 2.0) > 0.5) texcoord.y = 1.0 - texcoord.y;
        if(gpuparticleoptions.x > 0.5)
        {
            texcoord = texcoord * 0.5 + vec2(gpuflag(vnormal.w, 32.0), gpuflag(vnormal.w, 64.0)) * 0.5;
        }

        float alpha = vcolor.a * blend * alive;
        particlecolor = gpuparticleoptions.z > 0.5 ? vec4(vcolor.rgb * alpha, 1.0) : vec4(vcolor.rgb, alpha) * colorscale;
    }

    void getgpuparticlevertex(out vec3 worldpos, out vec3 particlecenter, out vec2 texcoord, out vec2 particlecoord, out vec2 billboardcoord,
                              out vec4 particlecolor, out float softenabled)
    {
        float size;
        getgpuparticlebase(particlecenter, size, texcoord, particlecoord, billboardcoord, particlecolor);
        worldpos = particlecenter + (particlebillboardright * billboardcoord.x + particlebillboardup * billboardcoord.y) * size;
        softenabled = step(distance(camera, worldpos), max(gpuparticleparams.z, 0.0));
    }
]

gpuparticleshader = [
    local softpart
    softpart = $arg2
    shader 0 $arg1 [
        //:fog
        @gpuparticlevertexdefs
        uniform mat4 camprojmatrix;
        varying vec4 color;
        varying vec2 texcoord0;
        @(? $softpart [
            uniform vec2 lineardepthscale;
            varying float lineardepth;
            varying vec2 surface;
            varying float softenabled;
        ])
        void main(void)
        {
            vec3 worldpos, particlecenter;
            vec2 particlecoord, billboardcoord;
            float usesoft;
            getgpuparticlevertex(worldpos, particlecenter, texcoord0, particlecoord, billboardcoord, color, usesoft);
            gl_Position = camprojmatrix * vec4(worldpos, 1.0);
            @(? $softpart [
                lineardepth = dot(lineardepthscale, gl_Position.zw);
                surface = particlecoord * 1.4142135623731;
                softenabled = usesoft;
            ])
        }
        ] [
            @(if $softpart [result [
            @(gfetchdefs tex2)
            uniform vec3 softparams;
            uniform vec2 particledepthscale;
            varying float lineardepth;
            varying vec2 surface;
            varying float softenabled;
        ]])
        uniform sampler2D tex0;
        varying vec4 color;
        varying vec2 texcoord0;
        fragdata(0) vec4 fragcolor;
        void main(void)
        {
            vec4 diffuse = texture2D(tex0, texcoord0);
            @(if $softpart [result [
                @(gdepthunpack depth [gfetch(tex2, gl_FragCoord.xy * particledepthscale)])
                float softfade = clamp((depth - lineardepth)*softparams.x - softparams.y - dot(surface, surface), 0.0, 1.0);
                diffuse.a *= mix(1.0, softfade, softenabled);
            ]])
            fragcolor = diffuse * color;
            if(fragcolor.a < 1.0e-4) discard;
        }
    ]
]

gpuparticleshader "gpuparticle" 0
gpuparticleshader "gpuparticlesoft" 1

particlelightshader = [
    local shadowrect
    local softpart
    local gpupart
    shadowrect = $arg2
    softpart = $arg3
    gpupart = (>= (strstr $arg1 "gpu") 0)
    shader 0 $arg1 [
        //:fog
        @(? $gpupart [
            @gpuparticlevertexdefs
            uniform mat4 camprojmatrix;
            varying vec4 color;
            varying vec2 texcoord0, particlecoord, billboardcoord;
            varying vec3 worldpos, particlecenter;
            @(? $softpart [
                uniform vec2 lineardepthscale;
                varying float lineardepth;
                varying vec2 surface;
                varying float softenabled;
            ])
            void main(void)
            {
                float usesoft;
                vec2 rotatedcoord;
                getgpuparticlevertex(worldpos, particlecenter, texcoord0, particlecoord, rotatedcoord, color, usesoft);
                billboardcoord = rotatedcoord;
                gl_Position = camprojmatrix * vec4(worldpos, 1.0);
                @(? $softpart [
                    lineardepth = dot(lineardepthscale, gl_Position.zw);
                    surface = particlecoord * 1.4142135623731;
                    softenabled = usesoft;
                ])
            }
        ] [
            attribute vec4 vvertex, vcolor;
            attribute vec2 vtexcoord0, vtexcoord1;
            uniform mat4 camprojmatrix;
            uniform vec4 colorscale;
            varying vec4 color;
            varying vec2 texcoord0;
            varying vec2 particlecoord;
            varying vec2 billboardcoord;
            varying vec3 worldpos, particlecenter;
            @(? $softpart [
                uniform vec2 lineardepthscale;
                varying float lineardepth;
                varying vec2 surface;
            ])
            void main(void)
            {
                gl_Position = camprojmatrix * vvertex;
                texcoord0 = vtexcoord0;
                particlecoord = vtexcoord1;
                billboardcoord = vtexcoord1;
                color = vcolor * colorscale;
                worldpos = vvertex.xyz;
                particlecenter = worldpos;
                @(? $softpart [
                    lineardepth = dot(lineardepthscale, gl_Position.zw);
                    surface = vtexcoord1.xy*1.4142135623731;
                ])
            }
        ])
    ] [
        //:fog mix(fogcolor, fogcolor * fragcolor.a, step(0.5, particlelowresmode))
        @(if $softpart [result [
            @(gfetchdefs tex2)
            uniform vec3 softparams;
            uniform vec2 particledepthscale;
            varying float lineardepth;
            varying vec2 surface;
            @(? $gpupart [varying float softenabled;])
        ]])
        uniform sampler2D tex0;
        @(? $shadowrect [uniform sampler2DRectShadow tex1;] [uniform sampler2DShadow tex1;])
        @(? $shadowrect [uniform sampler2DRect tex3;] [uniform sampler2D tex3;])
        uniform vec3 particlebillboardright;
        uniform vec3 particlebillboardup;
        uniform vec3 particlebillboarddir;
        uniform vec3 camera;
        uniform vec3 sunlightdir;
        uniform vec3 sunlightcolor;
        uniform mat3 csmmatrix;
        uniform vec4 csmtc[8];
        uniform vec3 csmoffset[8];
        uniform vec2 csmz;
        uniform int csmcount;
        uniform int particlelightcount;
        uniform int particletransmittanceatlas;
        uniform vec4 particlelightpos[4];   // xyz = light position / radius, w = 1 / radius
        uniform vec4 particlelightcolor[4]; // rgb = prepacked local-light chroma, a = luma
        uniform vec4 particlelightspot[4];  // xyz = -spotlight dir, w = spotlight scale
        uniform vec4 particlelightshadow[4];
        uniform vec2 particlelightoffset[4];
        uniform int particlesunlightdebug;
        uniform int particlelocallightdebug;
        uniform vec4 particlesunlightparams; // x = dark absorption percent, y = global intensity, z = transmission power, w = in-scattering
        uniform vec4 particlelightcolorparams; // x = sunlight tint percent, y = local-light tint percent, z = backlight intensity, w = shadow application intensity
        uniform float particlelocallightintensity;
        uniform float particlelowresmode;
        uniform vec2 shadowatlasscale;
        uniform float particlelightshadowmapscale;
        varying vec4 color;
        varying vec2 texcoord0;
        varying vec2 particlecoord;
        varying vec2 billboardcoord;
        varying vec3 worldpos, particlecenter;
        fragdata(0) vec4 fragcolor;

        vec3 getcsmtc(vec3 pos, float distbias)
        {
            vec3 tc;
            vec3 lightpos = csmmatrix * pos;
            lightpos.z -= distbias;
            tc.z = csmz.x + lightpos.z*csmz.y;
            for(int i = 0; i < 8; ++i)
            {
                if(i >= csmcount) break;
                tc.xy = csmtc[i].xy + lightpos.xy*csmtc[i].z;
                if(max(abs(tc.x), abs(tc.y)) < csmtc[i].w) return tc + csmoffset[i];
            }
            return vec3(-1.0);
        }

        float getparticleshadowscale()
        {
            float baseblur = max(particlelightshadowmapscale, 1.0);
            if(baseblur <= 1.0) return 1.0;

            // Approximate the particle's on-screen footprint from texcoord derivatives
            // so large smoke sprites receive a wider shadow blur without extra taps.
            float coverage = 1.0 / max(max(fwidth(texcoord0).x, fwidth(texcoord0).y), 1.0e-4);
            float sizefactor = clamp((coverage - 6.0) / 48.0, 0.0, 1.0);
            float extra = (baseblur - 1.0) * mix(0.35, 1.0, sizefactor);
            return baseblur + extra;
        }

        float ensureparticleshadowscale(inout float shadowscale)
        {
            if(shadowscale <= 0.0) shadowscale = getparticleshadowscale();
            return shadowscale;
        }

        vec4 getparticleshadowweights(vec3 shadowtc, float shadowscale, out vec3 center)
        {
            vec2 offset = fract(shadowtc.xy / shadowscale - 0.5);
            center = vec3((shadowtc.xy / shadowscale - offset*0.5) * shadowscale, shadowtc.z);
            return vec4(offset + 1.0, 2.0 - offset);
        }

        float shadowtap(vec3 shadowtc, vec2 offset, float shadowscale, vec4 shadowbounds)
        {
            vec2 samplexy = clamp(shadowtc.xy + offset * shadowscale, shadowbounds.xy, shadowbounds.zw);
            @(? $shadowrect [
                return float(shadow2DRect(tex1, vec3(samplexy, shadowtc.z)));
            ] [
                return float(shadow2D(tex1, vec3(samplexy * shadowatlasscale, shadowtc.z)));
            ])
        }

        float transmittancetap(vec3 shadowtc, vec2 offset, float shadowscale, vec4 shadowbounds)
        {
            vec2 samplexy = clamp(shadowtc.xy + offset * shadowscale, shadowbounds.xy, shadowbounds.zw);
            @(? $shadowrect [
                return texture2DRect(tex3, samplexy).r;
            ] [
                return texture2D(tex3, samplexy * shadowatlasscale).r;
            ])
        }

        void sampleparticleshadow(vec3 shadowtc, vec4 shadowbounds, inout float shadowscale, out float visibility, out float transmittance)
        {
            float localscale = ensureparticleshadowscale(shadowscale);
            vec3 center;
            vec4 size = getparticleshadowweights(shadowtc, localscale, center);
            vec4 weights = (1.0/9.0) * size.zxzx*size.wwyy;
            visibility = clamp(dot(weights,
                                   vec4(shadowtap(center, vec2(-0.5, -0.5), localscale, shadowbounds),
                                        shadowtap(center, vec2( 1.0, -0.5), localscale, shadowbounds),
                                        shadowtap(center, vec2(-0.5,  1.0), localscale, shadowbounds),
                                        shadowtap(center, vec2( 1.0,  1.0), localscale, shadowbounds))), 0.0, 1.0);
            if(visibility <= 1.0e-4)
            {
                transmittance = 0.0;
                return;
            }
            if(particletransmittanceatlas == 0)
            {
                transmittance = 1.0;
                return;
            }
            transmittance = clamp(dot(weights,
                                      vec4(transmittancetap(center, vec2(-0.5, -0.5), localscale, shadowbounds),
                                           transmittancetap(center, vec2( 1.0, -0.5), localscale, shadowbounds),
                                           transmittancetap(center, vec2(-0.5,  1.0), localscale, shadowbounds),
                                           transmittancetap(center, vec2( 1.0,  1.0), localscale, shadowbounds))), 0.0, 1.0);
        }

        float applyparticleshadowintensity(float attenuation)
        {
            float intensity = max(particlelightcolorparams.w, 0.0);
            float shadowing = clamp(attenuation, 0.0, 1.0);
            if(intensity <= 1.0e-4) return 1.0;
            if(shadowing <= 1.0e-4) return 0.0;
            return pow(shadowing, intensity);
        }

        void samplesunlight(vec3 pos, float distbias, inout float shadowscale, out float visibility, out float transmittance)
        {
            vec3 shadowtc = getcsmtc(pos, distbias);
            if(shadowtc.x < 0.0)
            {
                visibility = 1.0;
                transmittance = 1.0;
                return;
            }
            sampleparticleshadow(shadowtc, vec4(-1.0e16, -1.0e16, 1.0e16, 1.0e16), shadowscale, visibility, transmittance);
        }

        vec3 getparticlelightspottc(vec3 dir, float spotdist, vec4 spotparams, vec4 shadowparams, vec2 shadowoffset, float distbias)
        {
            vec2 mparams = shadowparams.xy / max(spotdist + distbias, 1e-5);
            return vec3((dir.xy - spotparams.xy*(spotdist + (spotparams.z > 0.0 ? 1.0 : -1.0)*dir.z)*shadowparams.z) * mparams.x + shadowoffset, mparams.y + shadowparams.w);
        }

        vec3 getparticlelightshadowtcaxis(vec3 dir, float axis, vec4 shadowparams, vec2 shadowoffset, float distbias,
                                          out vec4 shadowbounds)
        {
            vec4 proj;
            float facedist;
            if(axis < 0.5)
            {
                proj = vec4(dir.zyx, 0.0);
                facedist = abs(dir.x);
            }
            else if(axis < 1.5)
            {
                proj = vec4(dir.xzy, 1.0);
                facedist = abs(dir.y);
            }
            else
            {
                proj = vec4(dir, 2.0);
                facedist = abs(dir.z);
            }
            vec2 mparams = shadowparams.xy / max(facedist + distbias, 1.0e-5);
            vec2 facecenter = vec2(proj.w, step(0.0, proj.z)) * shadowparams.z + shadowoffset;
            float faceextent = max(0.5 * shadowparams.z - 0.5, 0.0);
            shadowbounds = vec4(facecenter - faceextent, facecenter + faceextent);
            return vec3(proj.xy * mparams.x + facecenter, mparams.y + shadowparams.w);
        }

        void sampleparticlelightshadow(vec3 dir, vec4 shadowparams, vec2 shadowoffset, inout float shadowscale, out float visibility,
                                       out float transmittance)
        {
            vec3 adir = abs(dir);
            float primaryaxis, secondaryaxis, primarydist, secondarydist;
            if(adir.x >= adir.y && adir.x >= adir.z)
            {
                primaryaxis = 0.0;
                primarydist = adir.x;
                secondaryaxis = adir.y >= adir.z ? 1.0 : 2.0;
                secondarydist = max(adir.y, adir.z);
            }
            else if(adir.y >= adir.z)
            {
                primaryaxis = 1.0;
                primarydist = adir.y;
                secondaryaxis = adir.x >= adir.z ? 0.0 : 2.0;
                secondarydist = max(adir.x, adir.z);
            }
            else
            {
                primaryaxis = 2.0;
                primarydist = adir.z;
                secondaryaxis = adir.x >= adir.y ? 0.0 : 1.0;
                secondarydist = max(adir.x, adir.y);
            }

            vec4 primarybounds;
            vec3 primarytc = getparticlelightshadowtcaxis(dir, primaryaxis, shadowparams, shadowoffset, 0.0, primarybounds);
            sampleparticleshadow(primarytc, primarybounds, shadowscale, visibility, transmittance);

            // Both rendered cubemap faces describe the same ray at their shared edge. Blend only near that edge to hide raster/filter differences.
            float faceblend = 0.5 * smoothstep(0.82, 1.0, secondarydist / max(primarydist, 1.0e-5));
            if(faceblend > 1.0e-4)
            {
                vec4 secondarybounds;
                vec3 secondarytc = getparticlelightshadowtcaxis(dir, secondaryaxis, shadowparams, shadowoffset, 0.0, secondarybounds);
                float secondaryvisibility, secondarytransmittance;
                sampleparticleshadow(secondarytc, secondarybounds, shadowscale, secondaryvisibility, secondarytransmittance);
                visibility = mix(visibility, secondaryvisibility, faceblend);
                transmittance = mix(transmittance, secondarytransmittance, faceblend);
            }
        }

        void applyparticlelight(inout vec3 shadedrgb, vec3 lighttint, float lightamount, float absorbmix, float density)
        {
            vec3 baseclamped = clamp(shadedrgb, 0.0, 1.0);
            float baseluma = clamp(dot(baseclamped, vec3(0.2126, 0.7152, 0.0722)), 0.0, 1.0);
            float darkness = 1.0 - baseluma;
            float darkpenalty = darkness * mix(0.55, 1.0, density);
            float receptivity = mix(1.0, 1.0 - 0.85 * darkpenalty, absorbmix);
            float applied = min(lightamount * receptivity, 1.75);
            float headroom = clamp(1.0 - max(max(baseclamped.r, baseclamped.g), baseclamped.b), 0.0, 1.0);
            // Lift darker particles more strongly while keeping brighter smoke from blowing out.
            vec3 lightlift = clamp(lighttint * (applied * mix(0.18, 0.80, headroom)), 0.0, 1.0);
            vec3 screenlit = 1.0 - (1.0 - baseclamped) * (1.0 - lightlift);
            vec3 lifted = shadedrgb + max(screenlit - baseclamped, vec3(0.0));
            shadedrgb = mix(shadedrgb, lifted, clamp(applied * mix(0.35, 0.85, headroom), 0.0, 1.0));
        }

        float getparticleedgefactor(float density)
        {
            // Favor semi-transparent silhouette regions so backlighting stays near visible smoke edges.
            return clamp(4.0 * density * (1.0 - density), 0.0, 1.0);
        }

        float getparticlebeamtransmittance(float transmittance)
        {
            return pow(clamp(transmittance, 0.0, 1.0), max(particlesunlightparams.z, 0.1));
        }

        float getparticlevolumerim(float beamtransmittance)
        {
            // The transmittance atlas contains the irregular outline of the combined particle volume. Select its transition, not the quad border.
            float transition = 4.0 * beamtransmittance * (1.0 - beamtransmittance);
            return transition * transition;
        }

        float getparticlemediumscatter(float transmittance, vec3 lightvec, float density)
        {
            float beam = getparticlebeamtransmittance(transmittance);
            vec3 viewdir = camera - worldpos;
            float viewdist2 = dot(viewdir, viewdir);
            viewdir = viewdist2 > 1.0e-5 ? viewdir * inversesqrt(viewdist2) : -particlebillboarddir;
            float forward = clamp(dot(lightvec, viewdir), 0.0, 1.0);
            vec2 lightplane = vec2(dot(lightvec, particlebillboardright), dot(lightvec, particlebillboardup));
            float sideamount = clamp(length(lightplane), 0.0, 1.0);
            vec2 sidedir = sideamount > 1.0e-4 ? lightplane / sideamount : vec2(0.0);
            float sidefacing = smoothstep(-0.45, 0.75, dot(billboardcoord, sidedir));
            float faceshape = mix(1.0, mix(0.08, 1.0, sidefacing), sideamount);
            float phase = mix(0.2, 0.75, forward * forward);
            phase = mix(phase, 0.8, sideamount);
            float densityresponse = 1.0 - 0.65 * density * density;
            return clamp((1.0 - beam) * clamp(particlesunlightparams.w, 0.0, 1.0) * phase * faceshape * densityresponse, 0.0, 1.0);
        }

        float getparticlebacklightshape(vec3 lightvec)
        {
            float behind = clamp(dot(lightvec, particlebillboarddir), 0.0, 1.0);
            vec2 lightplane = vec2(dot(lightvec, particlebillboardright), dot(lightvec, particlebillboardup));
            float sideamount = clamp(length(lightplane), 0.0, 1.0);
            vec2 sidedir = sideamount > 1.0e-4 ? lightplane / sideamount : vec2(0.0);
            float sidebias = clamp(dot(billboardcoord, sidedir), 0.0, 1.0);
            sidebias *= sidebias;
            return clamp(behind + sideamount * sidebias, 0.0, 1.0);
        }

        float sampleparticlelight(int index, float tintmix, float density, float edgefactor, inout float shadowscale, out vec3 lighttint,
                                  out float backlightamount, out float scatteramount)
        {
            backlightamount = 0.0;
            scatteramount = 0.0;
            vec3 lightdir = particlelightpos[index].xyz - worldpos * particlelightpos[index].w;
            float lightdist2 = dot(lightdir, lightdir);
            if(lightdist2 >= 1.0) return 0.0;

            float lightluma = particlelightcolor[index].a;
            if(lightluma <= 1.0e-4) return 0.0;

            float lightinvdist = inversesqrt(max(lightdist2, 1.0e-5));
            vec3 lightvec = lightdir * lightinvdist;
            float lightatten = 1.0 - lightdist2 * lightinvdist;
            float lighttransmittance = 1.0;
            float spotdist = 0.0;
            if(particlelightspot[index].w > 0.0)
            {
                spotdist = dot(lightdir, particlelightspot[index].xyz);
                float spotatten = 1.0 - (1.0 - lightinvdist * spotdist) * particlelightspot[index].w;
                if(spotatten <= 0.0) return 0.0;
                lightatten *= spotatten;
            }
            if(lightatten <= 1.0e-4) return 0.0;

            float unshadowedatten = lightatten;
            float beamtransmittance = 1.0;
            float volumerim = 1.0;
            float opaquevisibility = 1.0;
            if(particlelightcolorparams.w > 1.0e-4 && particlelightoffset[index].x >= 0.0)
            {
                // Receiver-space sampling makes transmittance describe the combined particle volume instead of one billboard center.
                float shadowvisibility;
                if(particlelightspot[index].w > 0.0)
                {
                    vec3 shadowtc = getparticlelightspottc(lightdir, spotdist, particlelightspot[index], particlelightshadow[index],
                                                           particlelightoffset[index], 0.0);
                    sampleparticleshadow(shadowtc, vec4(-1.0e16, -1.0e16, 1.0e16, 1.0e16), shadowscale, shadowvisibility,
                                         lighttransmittance);
                }
                else sampleparticlelightshadow(lightdir, particlelightshadow[index], particlelightoffset[index], shadowscale, shadowvisibility,
                                               lighttransmittance);
                if(shadowvisibility <= 1.0e-4) return 0.0;
                beamtransmittance = getparticlebeamtransmittance(lighttransmittance);
                volumerim = getparticlevolumerim(beamtransmittance);
                opaquevisibility = applyparticleshadowintensity(shadowvisibility);
                scatteramount = unshadowedatten * lightluma * opaquevisibility * getparticlemediumscatter(lighttransmittance, lightvec, density);
                lightatten *= applyparticleshadowintensity(shadowvisibility * beamtransmittance);
            }

            vec3 chroma = particlelightcolor[index].rgb;
            lighttint = clamp(vec3(1.0) + (chroma - vec3(1.0)) * tintmix, 0.0, 5.0);
            if(edgefactor > 1.0e-4 && opaquevisibility > 1.0e-4)
            {
                float backlightshape = getparticlebacklightshape(lightvec);
                backlightamount = unshadowedatten * opaquevisibility * lightluma * backlightshape * edgefactor * volumerim;
            }
            return lightatten * lightluma;
        }

        vec4 encodeparticlelightcolor(vec4 shaded)
        {
            if(particlelowresmode > 0.5)
            {
                shaded.rgb *= shaded.a;
            }
            return shaded;
        }

        void main(void)
        {
            vec4 diffuse = texture2D(tex0, texcoord0);

            @(if $softpart [result [
                @(gdepthunpack depth [gfetch(tex2, gl_FragCoord.xy * particledepthscale)])
                float softfade = clamp((depth - lineardepth)*softparams.x - softparams.y - dot(surface, surface), 0.0, 1.0);
                diffuse.a *= @(? $gpupart [mix(1.0, softfade, max(softenabled, step(0.5, particlelowresmode)))] [softfade]);
            ]])

            vec4 base = diffuse * color;
            if(base.a < 1.0e-4) discard;
            vec4 shaded = base;
            float density = clamp(base.a, 0.0, 1.0);
            float absorbmix = clamp(particlesunlightparams.x * 0.01, 0.0, 1.0);
            float sunluma = clamp(dot(max(sunlightcolor, vec3(0.0)), vec3(0.2126, 0.7152, 0.0722)), 0.0, 2.0);
            float backlightintensity = max(particlelightcolorparams.z, 0.0);
            float edgefactor = backlightintensity > 1.0e-4 ? getparticleedgefactor(density) : 0.0;
            float particleshadowscale = 0.0;
            float sunshadow = 1.0;
            float suntransmittance = 1.0;
            float sunbeamtransmittance = 1.0;
            float sunvolumerim = 1.0;
            float sunopaquevisibility = 1.0;
            float sunscattervisibility = 0.0;
            float visibility = 0.0;
            float maxlocalamount = 0.0;
            bool hassun = base.a > 0.0 && csmcount > 0 && sunluma > 1.0e-4 && particlesunlightparams.y > 1.0e-4;
            if(hassun)
            {
                if(particlelightcolorparams.w > 1.0e-4)
                {
                    // Cascade sampling must vary across the billboard for the same volume-silhouette mask used by local lights.
                    samplesunlight(worldpos, 0.0, particleshadowscale, sunshadow, suntransmittance);
                    sunbeamtransmittance = getparticlebeamtransmittance(suntransmittance);
                    sunvolumerim = getparticlevolumerim(sunbeamtransmittance);
                    sunopaquevisibility = applyparticleshadowintensity(sunshadow);
                    visibility = applyparticleshadowintensity(sunshadow * sunbeamtransmittance);
                    sunscattervisibility = sunopaquevisibility * getparticlemediumscatter(suntransmittance, sunlightdir, density);
                }
                else visibility = 1.0;
            }

            if(particlesunlightdebug > 0)
            {
                if(particlesunlightdebug > 1)
                {
                    fragcolor = encodeparticlelightcolor(vec4(0.0, 1.0, 1.0, base.a));
                    return;
                }

                fragcolor = encodeparticlelightcolor(hassun && visibility > 0.5 ? vec4(1.0, 0.0, 1.0, base.a) : base);
                return;
            }

            if(base.a > 0.0 && particlelightcount > 0 && particlelocallightintensity > 1.0e-4)
            {
                float localtintmix = clamp(particlelightcolorparams.y * 0.01, 0.0, 2.0);
                vec3 accumulatedtint = vec3(0.0);
                vec3 accumulatedscattertint = vec3(0.0);
                vec3 accumulatedbacktint = vec3(0.0);
                float accumulatedamount = 0.0;
                float accumulatedscatteramount = 0.0;
                float accumulatedbackamount = 0.0;
                for(int i = 0; i < 4; ++i)
                {
                    if(i >= particlelightcount) break;
                    vec3 localtint;
                    float localbackamount;
                    float localscatteramount;
                    float localamount = sampleparticlelight(i, localtintmix, density, edgefactor, particleshadowscale, localtint, localbackamount,
                                                            localscatteramount);
                    maxlocalamount = max(maxlocalamount, localamount + localscatteramount);
                    if(localamount > 1.0e-4)
                    {
                        float weight = localamount * particlelocallightintensity;
                        accumulatedtint += localtint * weight;
                        accumulatedamount += weight;
                    }
                    if(localscatteramount > 1.0e-4)
                    {
                        float scatterweight = localscatteramount * particlelocallightintensity;
                        accumulatedscattertint += localtint * scatterweight;
                        accumulatedscatteramount += scatterweight;
                    }
                    if(localbackamount > 1.0e-4)
                    {
                        // Backlight uses the silhouette's short optical path, so it must not be capped by the center-transmitted direct term.
                        float backweight = localbackamount * particlelocallightintensity * backlightintensity;
                        accumulatedbacktint += localtint * backweight;
                        accumulatedbackamount += backweight;
                    }
                }
                if(accumulatedamount > 1.0e-4)
                {
                    vec3 blendedtint = accumulatedtint / max(accumulatedamount, 1.0e-5);
                    applyparticlelight(shaded.rgb, blendedtint, accumulatedamount, absorbmix, density);
                }
                if(accumulatedscatteramount > 1.0e-4)
                {
                    vec3 blendedscattertint = accumulatedscattertint / max(accumulatedscatteramount, 1.0e-5);
                    applyparticlelight(shaded.rgb, blendedscattertint, accumulatedscatteramount, 0.0, 0.0);
                }
                if(accumulatedbackamount > 1.0e-4)
                {
                    vec3 blendedbacktint = accumulatedbacktint / max(accumulatedbackamount, 1.0e-5);
                    applyparticlelight(shaded.rgb, blendedbacktint, accumulatedbackamount, 0.0, 0.0);
                }
            }

            if(particlelocallightdebug > 0)
            {
                if(particlelocallightdebug > 3)
                {
                    float debugcount = clamp(float(particlelightcount) * 0.25, 0.0, 1.0);
                    fragcolor = encodeparticlelightcolor(vec4(vec3(debugcount), base.a));
                    return;
                }
                if(particlelocallightdebug > 2)
                {
                    fragcolor = encodeparticlelightcolor(particlelightcount > 0 ? vec4(0.0, 1.0, 1.0, base.a) : vec4(1.0, 0.0, 0.0, base.a));
                    return;
                }
                if(particlelocallightdebug > 1)
                {
                    float debugamount = clamp(maxlocalamount * particlelocallightintensity * 0.25, 0.0, 1.0);
                    fragcolor = encodeparticlelightcolor(vec4(vec3(debugamount), base.a));
                    return;
                }

                fragcolor = encodeparticlelightcolor(maxlocalamount > 1.0e-4 ? vec4(0.0, 1.0, 0.0, base.a) : base);
                return;
            }

            if(hassun)
            {
                float suntintmix = clamp(particlelightcolorparams.x * 0.01, 0.0, 1.0);
                vec3 suntint = mix(vec3(1.0), clamp(sunlightcolor / max(sunluma, 1.0e-4), 0.0, 3.0), suntintmix);
                float suncontrib = max(visibility, 0.0) * sunluma * particlesunlightparams.y;
                applyparticlelight(shaded.rgb, suntint, suncontrib, absorbmix, density);
                float sunscatter = sunscattervisibility * sunluma * particlesunlightparams.y;
                if(sunscatter > 1.0e-4) applyparticlelight(shaded.rgb, suntint, sunscatter, 0.0, 0.0);
                if(edgefactor > 1.0e-4)
                {
                    float sunbackshape = getparticlebacklightshape(sunlightdir);
                    float sunback = sunopaquevisibility * sunluma * particlesunlightparams.y * sunbackshape * edgefactor * backlightintensity *
                                    sunvolumerim;
                    if(sunback > 1.0e-4) applyparticlelight(shaded.rgb, suntint, sunback, 0.0, 0.0);
                }
            }

            fragcolor = encodeparticlelightcolor(shaded);
        }
    ]
]

particlelightshader "gpuparticlelightrect" 1 0
particlelightshader "gpuparticlelight2d" 0 0
particlelightshader "gpuparticlesoftlightrect" 1 1
particlelightshader "gpuparticlesoftlight2d" 0 1

shader 0 "particlelightupsample" [
    attribute vec4 vvertex;
    void main(void)
    {
        gl_Position = vvertex;
    }
] [
    uniform sampler2DRect tex0;
    @(gfetchdefs tex1 $msaalight)
    uniform vec4 particlelightscaleparams; // xy = output/source, zw = source/output
    uniform float particlelightdepthscale;
    uniform vec4 viewsize;
    fragdata(0) vec4 fragcolor;

    float getparticleupscaledepth(vec2 tc)
    {
        @(gdepthunpack depth [gfetch(tex1, tc)])
        return depth;
    }

    void main(void)
    {
        vec2 outputtc = gl_FragCoord.xy;
        float outputdepth = getparticleupscaledepth(outputtc);
        vec2 sourcesize = max(floor(viewsize.xy * particlelightscaleparams.zw + vec2(0.5)), vec2(1.0));
        vec2 sourcepos = outputtc * particlelightscaleparams.zw - vec2(0.5);
        vec2 base = floor(sourcepos), blend = fract(sourcepos);

        vec4 accum = vec4(0.0), best = vec4(0.0);
        float totalweight = 0.0, bestdeptherror = 1.0e16;
        for(int y = 0; y < 2; ++y)
        {
            for(int x = 0; x < 2; ++x)
            {
                vec2 offset = vec2(float(x), float(y));
                float spatialweight = (x == 0 ? 1.0 - blend.x : blend.x) * (y == 0 ? 1.0 - blend.y : blend.y);
                if(spatialweight <= 1.0e-6) continue;

                vec2 pixel = clamp(base + offset, vec2(0.0), sourcesize - vec2(1.0));
                vec2 sampletc = pixel + vec2(0.5);
                vec2 depthtc = clamp(sampletc * particlelightscaleparams.xy, vec2(0.5), viewsize.xy - vec2(0.5));
                float depththreshold = max(abs(outputdepth) * particlelightdepthscale, 1.0);
                float deptherror = abs(getparticleupscaledepth(depthtc) - outputdepth) / depththreshold;
                vec4 samplecolor = texture2DRect(tex0, sampletc);

                if(deptherror < bestdeptherror)
                {
                    bestdeptherror = deptherror;
                    best = samplecolor;
                }
                if(deptherror > 3.0) continue;

                float weight = spatialweight * exp(-deptherror * deptherror);
                accum += samplecolor * weight;
                totalweight += weight;
            }
        }

        fragcolor = totalweight > 1.0e-5 ? accum / totalweight : best;
    }
]

shader 0 "gpuparticleshadow" [
    @gpuparticlevertexdefs
    attribute float vtangent;
    uniform mat4 shadowmatrix;
    uniform vec4 gpuparticleshadowparams; // x = SM_CASCADE/SM_SPOT/SM_CUBEMAP, y = shadow side
    uniform vec3 gpuparticleshadoworigin, gpuparticleshadowdir;
    varying vec2 texcoord0;
    varying float alpha;
    void main(void)
    {
        if(gpuflag(vtangent, exp2(gpuparticleshadowparams.y)) < 0.5)
        {
            gl_Position = vec4(2.0, 0.0, 0.0, 1.0);
            texcoord0 = vec2(0.0);
            alpha = 0.0;
            return;
        }

        vec3 center;
        vec2 particlecoord, billboardcoord;
        vec4 particlecolor;
        float size;
        getgpuparticlebase(center, size, texcoord0, particlecoord, billboardcoord, particlecolor);

        // Keep the light-space volume proxy independent from the camera-facing
        // render billboard so rotating the camera cannot alter shadow coverage.
        vec3 dir = abs(gpuparticleshadowparams.x - 3.0) < 0.5 ? gpuparticleshadowdir : center - gpuparticleshadoworigin;
        if(dot(dir, dir) <= 1.0e-6) dir = gpuparticleshadowdir;
        if(dot(dir, dir) <= 1.0e-6) dir = vec3(0.0, 0.0, 1.0);
        dir = normalize(dir);
        vec3 axis = abs(dir.z) < 0.999 ? vec3(0.0, 0.0, 1.0) : vec3(0.0, 1.0, 0.0);
        vec3 right = normalize(cross(axis, dir));
        vec3 up = normalize(cross(dir, right));
        vec3 worldpos = center + (right * billboardcoord.x + up * billboardcoord.y) * size;
        gl_Position = shadowmatrix * vec4(worldpos, 1.0);
        alpha = particlecolor.a;
    }
] [
    uniform sampler2D tex0;
    uniform vec4 particleshadowparams; // x = opacity, y = extinction, z = Beer-Lambert toggle
    varying vec2 texcoord0;
    varying float alpha;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        float shadow = clamp(texture2D(tex0, texcoord0).a * alpha * particleshadowparams.x, 0.0, 1.0);
        if(shadow <= 1.0/255.0) discard;
        float transmittance = particleshadowparams.z > 0.5 ? exp(-shadow * max(particleshadowparams.y, 0.0)) : (1.0 - shadow);
        fragcolor = vec4(vec3(clamp(transmittance, 0.0, 1.0)), 1.0);
    }
]

shader 0 "particleHaze" [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 camprojmatrix;
    uniform vec2 lineardepthscale;
    varying vec4 color;
    varying vec2 texcoord0, surface;
    varying float lineardepth;
    void main(void)
    {
        gl_Position = camprojmatrix * vvertex;
        texcoord0 = vtexcoord0;
        color = vcolor;
        lineardepth = dot(lineardepthscale, gl_Position.zw);
        surface = vtexcoord0.xy*2.82842712474619 - 1.4142135623731;
    }
] [
    @(gfetchdefs [tex1 tex2])
    uniform vec4 heatHazeParams;
    uniform vec2 heatHazeStrengths;
    uniform vec2 heatHazeScroll;
    uniform vec4 heatHazeOptions;
    uniform vec4 viewsize;
    uniform sampler2D tex0;
    varying vec4 color;
    varying vec2 texcoord0, surface;
    varying float lineardepth;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        vec2 noiseTC = fract(texcoord0 + heatHazeScroll);
        vec4 noise = texture2D(tex0, noiseTC);
        vec2 jitter = (noise.xy*2.0 - 1.0) * 1.35;
        float noiseEdgeFade = clamp(noise.a * 1.35, 0.0, 1.0);
        float edgeFade = mix(1.0, noiseEdgeFade, clamp(heatHazeOptions.x, 0.0, 1.0));

        @(gdepthunpack depth [gfetch(tex2, gl_FragCoord.xy)])
        float camDepth = abs(lineardepth);
        float distMix = clamp((camDepth - heatHazeParams.z)*heatHazeParams.w, 0.0, 1.0);
        float softFade = clamp((lineardepth - depth)*heatHazeParams.y, 0.0, 1.0);
        float mask = clamp(1.0 - dot(surface, surface), 0.0, 1.0);
        float lifeFade = clamp(color.a, 0.0, 1.0);
        float colorMod = clamp(dot(color.rgb, vec3(0.299, 0.587, 0.114)), 0.0, 1.0);
        float strength = mix(heatHazeStrengths.x, heatHazeStrengths.y, distMix)
                         * heatHazeParams.x * mask * softFade * lifeFade * colorMod;

        vec2 sceneTC = floor(gl_FragCoord.xy) + 0.5;
        vec2 rtc = floor(sceneTC + jitter*strength) + 0.5;
        rtc = clamp(rtc, vec2(0.5), viewsize.xy - vec2(0.5));
        // Fetch scene depth at the candidate refracted position.
        @(gdepthunpack refractDepth [gfetch(tex2, rtc)])
        // If the geometry there is in front of the haze, the refracted sample
        float refractFade = clamp((lineardepth - refractDepth) * heatHazeParams.y, 0.0, 1.0);
        rtc = mix(sceneTC, rtc, refractFade);

        vec3 refracted = gfetch(tex1, rtc).rgb;
        float amount = clamp(mask * softFade * edgeFade * lifeFade, 0.0, 1.0);
        fragcolor = vec4(refracted, amount);
    }
]

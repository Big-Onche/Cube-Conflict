////////////////////////////////////////////////
//
// procedural instanced grass shaders
//
////////////////////////////////////////////////

// grasstype:
//   b -> blendmap

grassopt = [ >= (strstr $grasstype $arg1) 0 ]

grassvertexdefs = [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    attribute vec4 vtexcoord1;
    uniform vec3 camera;
    uniform vec4 grassmeshparams;  // width, height, wind scale
    uniform vec4 grassdrawparams;  // density, transition fade, distance, taper start
    uniform vec4 grasswindparams;  // phase, strength, direction
    uniform vec4 grasswindspatial; // spatial frequency, margin, margin fade
    uniform vec4 grassdamagecontrol; // burn event count, unused, radius padding, shape variation
    uniform vec4 grassburntimingparams; // propagation milliseconds, fade-in milliseconds, glow animation milliseconds
    uniform vec4 grassdamageparams[64]; // center XYZ, radius
    uniform vec4 grassdamagestates[64]; // color recovery, random seed, burn age milliseconds
    uniform float grasstest;

    float grassedgecoverage()
    {
        float margin = grasswindspatial.y > 0.0 ? smoothstep(0.0, grasswindspatial.y, vtexcoord1.z) : 1.0;
        return mix(1.0, margin, grasswindspatial.z);
    }

    bool grassrejectinstance(out float instancehash, out float coverage)
    {
        instancehash = vtexcoord1.y;
        if(instancehash > grassdrawparams.x)
        {
            coverage = 0.0;
            return true;
        }

        coverage = grassedgecoverage();
        return coverage <= grasstest;
    }

    bool grassrejectshadowinstance(out float instancehash, out float coverage)
    {
        instancehash = vtexcoord1.y;
        if(instancehash > grassdrawparams.x)
        {
            coverage = 0.0;
            return true;
        }

        coverage = grassedgecoverage();
        return coverage <= grasstest;
    }

    float grassdamageradius(vec3 offset, vec4 damage, float seed)
    {
        float angle = atan(offset.y, offset.x),
              jitter = fract(sin(vtexcoord1.y*91.713 + seed*37.119)*43758.5453)*2.0 - 1.0,
              contour = 0.55*sin(angle*5.0 + seed*6.283185307) +
                        0.30*sin(angle*9.0 - seed*4.976) + 0.15*jitter;
        return max(damage.w*(1.0 + grassdamagecontrol.w*contour) + grassdamagecontrol.z, 0.0);
    }

    void grassburnstate(out float burndamage, out float burnglow)
    {
        float burn = 0.0, glow = 0.0;
        for(int i = 0; i < 64; ++i)
        {
            if(i >= int(grassdamagecontrol.x)) break;
            vec3 offset = vcolor.xyz - grassdamageparams[i].xyz;
            float radius = grassdamageradius(offset, grassdamageparams[i], grassdamagestates[i].y);
            if(dot(offset, offset) <= radius*radius)
            {
                float strength = 1.0 - grassdamagestates[i].x,
                      ignitiondelay = length(offset)/max(radius, 0.0001)*grassburntimingparams.x,
                      burnage = grassdamagestates[i].z - ignitiondelay,
                      ignition = clamp(burnage/max(grassburntimingparams.y, 1.0), 0.0, 1.0),
                      glowphase = clamp(burnage/max(grassburntimingparams.z, 1.0), 0.0, 1.0);
                burn = max(burn, strength*ignition);
                glow = max(glow, strength*ignition*(1.0 - abs(2.0*glowphase - 1.0)));
            }
        }
        burndamage = clamp(burn, 0.0, 1.0);
        burnglow = clamp(glow, 0.0, 1.0);
    }

    vec3 grassworldvertex(float instancehash)
    {
        float angle = vcolor.w;
        float ca = cos(angle), sa = sin(angle);
        vec2 localxy = vec2(ca*vvertex.x - sa*vvertex.y, sa*vvertex.x + ca*vvertex.y) * grassmeshparams.x * vtexcoord1.x;
        float taper = 1.0;
        if(grassdrawparams.z > grassdrawparams.w)
        {
            float dist = distance(camera, vcolor.xyz);
            taper = clamp((grassdrawparams.z - dist)/(grassdrawparams.z - grassdrawparams.w), 0.0, 1.0);
        }
        float height = grassmeshparams.y * vtexcoord1.x * taper;
        vec3 worldpos = vec3(vcolor.xyz + vec3(localxy, height*vvertex.z - 0.197*grassmeshparams.y));

        if(grassmeshparams.z > 0.0 && grasswindparams.y != 0.0)
        {
            float phase = 6.283185307 * (grasswindparams.x + instancehash +
                          dot(vcolor.xy, vec2(grasswindspatial.x, grasswindspatial.x*1.371)));
            float bend = sin(phase) * grasswindparams.y * grassmeshparams.z * height * vvertex.z*vvertex.z;
            worldpos.xy += grasswindparams.zw * bend;
        }

        return worldpos;
    }
]

grassvariantshader = [
    local grasstype
    grasstype = $arg2
    variantshader 0 $arg1 (? (grassopt "b") 0 -1) [
        @grassvertexdefs
        uniform mat4 camprojmatrix;
        @(ginterpvert)
        varying vec2 texcoord0;
        varying float coverage, burndamage, burnglow;
        @(? (grassopt "b") [uniform vec4 blendmapparams; varying vec2 texcoord1;])
        void main(void)
        {
            float instancehash;
            if(grassrejectinstance(instancehash, coverage))
            {
                // Collapse every vertex in the rejected instance outside the clip volume.
                gl_Position = vec4(2.0, 0.0, 0.0, 1.0);
                texcoord0 = vec2(0.0);
                coverage = burndamage = burnglow = 0.0;
                @(? (grassopt "b") [texcoord1 = vec2(0.0);])
                return;
            }
            vec3 worldpos = grassworldvertex(instancehash);
            grassburnstate(burndamage, burnglow);
            gl_Position = camprojmatrix * vec4(worldpos, 1.0);
            texcoord0 = vtexcoord0;
            @(? (grassopt "b") [
                texcoord1 = (worldpos.xy - blendmapparams.xy)*blendmapparams.zw;
            ])
            @(gdepthpackvert)
        }
    ] [
        uniform sampler2D tex0, tex2;
        uniform vec4 grasscolourparams, grassdrawparams;
        uniform vec3 grassburncolourparams, grassburnglowcolourparams, grassburnanimparams;
        uniform float grasstest;
        @(ginterpfrag)
        varying vec2 texcoord0;
        varying float coverage, burndamage, burnglow;
        @(? (grassopt "b") [uniform sampler2D tex1; varying vec2 texcoord1;])
        void main(void)
        {
            vec4 color = texture2D(tex0, texcoord0) * grasscolourparams;
            color.rgb *= mix(vec3(1.0), grassburncolourparams, burndamage);
            color.a *= coverage;
            @(? (grassopt "b") [
                color.a *= texture2D(tex1, texcoord1).r;
            ])
            float alphatest = mix(1.0, grasstest, grassdrawparams.y);
            if(color.a <= alphatest) discard;
            gcolor = vec4(color.rgb, 0.0);
            float burnmask = texture2D(tex2, texcoord0 + grassburnanimparams.xy).r;
            vec3 glow = grassburnglowcolourparams * (burnmask*burnglow*grassburnanimparams.z);
            @(gglowpack glow packnorm)
            @(gnormpackdef [vec3(0.5, 0.5, 1.0)] packnorm)
            @(gdepthpackfrag)
        }
    ]
]

grassshadowvariantshader = [
    local grasstype
    grasstype = $arg2
    variantshader 0 $arg1 (? (grassopt "b") 0 -1) [
        @grassvertexdefs
        uniform mat4 shadowmatrix;
        varying vec2 texcoord0;
        varying float coverage;
        @(? (grassopt "b") [uniform vec4 blendmapparams; varying vec2 texcoord1;])
        void main(void)
        {
            float instancehash;
            if(grassrejectshadowinstance(instancehash, coverage))
            {
                // Collapse every vertex in the rejected instance outside the clip volume.
                gl_Position = vec4(2.0, 0.0, 0.0, 1.0);
                texcoord0 = vec2(0.0);
                coverage = 0.0;
                @(? (grassopt "b") [texcoord1 = vec2(0.0);])
                return;
            }
            vec3 worldpos = grassworldvertex(instancehash);
            gl_Position = shadowmatrix * vec4(worldpos, 1.0);
            texcoord0 = vtexcoord0;
            @(? (grassopt "b") [
                texcoord1 = (worldpos.xy - blendmapparams.xy)*blendmapparams.zw;
            ])
        }
    ] [
        uniform sampler2D tex0;
        uniform float grasstest;
        varying vec2 texcoord0;
        varying float coverage;
        @(? (grassopt "b") [uniform sampler2D tex1; varying vec2 texcoord1;])
        void main(void)
        {
            float alpha = texture2D(tex0, texcoord0).a * coverage;
            @(? (grassopt "b") [
                alpha *= texture2D(tex1, texcoord1).r;
            ])
            if(alpha <= grasstest) discard;
        }
    ]
]

grassshader = [
    grassvariantshader "grass" ""
    grassvariantshader "grass" "b"
]

grassshadowshader = [
    grassshadowvariantshader "grassshadow" ""
    grassshadowvariantshader "grassshadow" "b"
]

msaadetectedges = [
    result [{
        @(if (glext "GL_EXT_shader_samples_identical") [result [
            if(textureSamplesIdenticalEXT(tex1, ivec2(gl_FragCoord.xy)))
            {
                @arg1
            }
            else 
        ]])

        { 
            vec4 e = texelFetch(tex1, ivec2(gl_FragCoord.xy), 0);
            e.xyz -= 0.5;
            float maxdiff = 0.98*0.98*dot(e.xyz, e.xyz); 

            @(loopconcat+ i 1 (- $msaasamples 1) [result [
                vec4 e@i = texelFetch(tex1, ivec2(gl_FragCoord.xy), @i);
                e@i.xyz -= 0.5;
                if(abs(e.w-e@i.w) <= 2.0/255.0 && pow(dot(e@i.xyz, e.xyz), 2.0) >= maxdiff*dot(e@i.xyz, e@i.xyz))
                {
            ]])

            @arg1

            @(loopconcat+ i 1 (- $msaasamples 1) [result [
                }
            ]])
        }
    }]
]

lazyshader 0 msaaedgedetect [
    attribute vec4 vvertex;
    void main(void)
    {
        gl_Position = vvertex;
    }
] [
    @(? (glext "GL_EXT_shader_samples_identical") [
        #extension GL_EXT_shader_samples_identical : enable
    ])
    uniform sampler2DMS tex1;

    void main(void)
    {
        @(msaadetectedges [discard;])
    }
]

// deferredlighttype:
//    p -> point-light shadow (default cubemap)
//    P -> point-light color shadow
//    c -> CSM
//    C -> color CSM
//    a -> AO
//    A -> AO sun
//    r -> radiance hints
//    G -> 5x5 weighted gather filter
//    g -> 3x3 weighted gather filter
//    E -> 5x5 weighted bilinear filter
//    F -> 3x3 weighted bilinear filter
//    f -> 4x rotated grid filter
//    N -> no filtering
//    m -> minimap
//    M -> multisampled
//    O -> sample 1
//    R -> manual resolve
//    S -> sample shading
//    T -> edge detection
//    n -> tile batching
//    s -> spotlights
//    t -> transparent
//    b -> combined base/light variants
//    d -> avatar shadow dist bias variants
//    D -> disable dist bias
//    z -> spec toggle
dlopt = [ >= (strstr $deferredlighttype $arg1) 0 ]

unpacknormbias = 0.005
unpacknormscale = (+f 1 (*f 2 $unpacknormbias))
unpacknorm = [
    result [
        @arg1 = clamp(@arg1 * @(divf $unpacknormscale 0.5) - @(+f (*f $unpacknormscale (divf 0.25 0.5)) $unpacknormbias), 0.0, 1.0);
    ]
]

unpackspec = [
    result [
        vec3 camdir = normalize(camera - pos.xyz);
        float facing = 2.0*dot(normal.xyz, camdir);
        float specscale = min(3.0*(diffuse.a + 0.5/255.0), 2.999), gloss = floor(specscale);
        specscale -= gloss;
        specscale = (0.35 + 0.15*gloss) * specscale / (1.5 - specscale);
        gloss = 5.0 + 17.0*gloss;
    ]
]

deferredlightvariantshader = [
    local deferredlighttype
    deferredlighttype = $arg3
    numsplits = (+ $arg4 0)
    numrh = (+ $arg5 0)
    numlights = (+ $arg6 0)
    baselight = (< (mod $arg2 4) 2)
    spotlight = (>= (mod $arg2 8) 4) 
    transparent = (<= 8 $arg2 15)
    avatar = (<= 24 $arg2 31)
    local colorshadow
    colorshadow = (|| (? (<= 16 $arg2 23) 2) [&& (dlopt "C") [! $transparent] [! $avatar]])
    variantshader 0 $arg1 $arg2 (? (< $arg2 0) [
        attribute vec4 vvertex;
        uniform mat4 lightmatrix;
        void main(void)
        {
            gl_Position = lightmatrix * vvertex;
        }
    ]) [
        @(? (&& (dlopt "S") [< $glslversion 400]) [
            #extension GL_ARB_sample_shading : enable
        ])
        @(? (&& (dlopt "T") [glext "GL_EXT_shader_samples_identical"]) [
            #extension GL_EXT_shader_samples_identical : enable
        ])
        @(if (dlopt "M") [result [
            uniform sampler2DMS tex0, tex1, tex3 @(? $transparent [, tex2]);
        ]] [result [
            uniform sampler2DRect tex0, tex1, tex3 @(? $transparent [, tex2]);
        ]])
        @(if (|| (dlopt "p") (dlopt "c")) [
            if (|| (dlopt "g") (dlopt "G")) [if (> $usetexgather 1) [result [
                uniform sampler2DShadow tex4;
            ]] [result [
                uniform sampler2D tex4;
            ]]] [result [
                uniform sampler2DRectShadow tex4;
            ]]
        ])
        @(if $numlights [result [
            uniform vec4 lightpos[@@numlights];
            uniform vec4 lightcolor[@@numlights];
            @(if $spotlight [result [
                uniform vec4 spotparams[@@numlights];
            ]])
            @(if (dlopt "p") [result [
                uniform vec4 shadowparams[@@numlights], shadowsoft[@@numlights];
                uniform vec2 shadowoffset[@@numlights];
                uniform vec2 smreceiverbias;
            ]])
        ]])
        @(if $numsplits [result [
            uniform vec4 csmtransform[@@numsplits], csmdepth[@@numsplits];
            uniform vec2 csmdistances[@@numsplits];
            uniform vec4 csmbiasparams;
            uniform float csmpcfparams;
            uniform vec3 csmviewdir;
            uniform sampler2DArrayShadow tex12;
            uniform sampler2DArray tex13;
            @(? $colorshadow [uniform sampler2DArray tex14;])
            uniform vec4 csmpcssparams;
            uniform vec3 csmpcssdistance;
            uniform vec2 csmpcsscounts;
            #if __VERSION__ < 130
                #define csmcompare(tc) float(shadow2DArray(tex12, tc))
                #define csmrawdepth(tc) texture2DArray(tex13, tc).r
                #define csmtransdepth(tc) texture2DArray(tex14, tc).a
                #define csmcolor(tc) texture2DArray(tex10, tc).rgb
            #else
                #define csmcompare(tc) texture(tex12, tc)
                #define csmrawdepth(tc) texture(tex13, tc).r
                #define csmtransdepth(tc) texture(tex14, tc).a
                #define csmcolor(tc) texture(tex10, tc).rgb
            #endif
        ]])
        @(if (dlopt "c") [result [
            uniform mat3 csmmatrix;
            uniform vec3 sunlightdir;
            uniform vec3 sunlightcolor;
            uniform sampler2D tex15;
            uniform vec3 cloudshadowcolor;
            uniform vec4 cloudshadowparams;
            uniform vec4 cloudshadowtransform;
            uniform float cloudshadowstrength;
            @(if (dlopt "r") [result [
                uniform vec3 skylightcolor;
                uniform float giscale, rhnudge, rhbounds;
                uniform vec4 rhtc[@@numrh];
                uniform sampler3D tex6, tex7, tex8, tex9;
            ]])
        ]])
        @(? $colorshadow [
            uniform sampler2DArray tex10;
            uniform float shadowcolorscale;
            #define sunshadowtype vec3
        ] [
            #define sunshadowtype float
        ])
        @(? (> $colorshadow 1) [
            uniform sampler2DRect tex11;
            #define lightshadowtype vec3
            #define filterlightshadow(tc, gradient) (filtershadow(tc, gradient) * filtercolorshadow(tex11, tc))
        ] [
            #define lightshadowtype float
            #define filterlightshadow filtershadow
        ])
        uniform vec3 camera;
        uniform mat4 worldmatrix;
        @(? (|| (dlopt "p") [dlopt "c"]) [uniform mat4 shadowworldmatrix;])
        uniform vec4 fogdir;
        uniform vec3 fogcolor;
        uniform vec2 fogdensity;
        uniform vec4 radialfogscale;
        uniform vec2 shadowatlasscale;
        uniform vec4 lightscale;
        @(? (&& (dlopt "a") [! $avatar] [! $transparent]) [uniform sampler2DRect tex5; uniform vec2 aoscale; uniform vec4 aoparams;])
        @(gdepthunpackparams)
        fragdata(0) vec4 fragcolor;

        @(if (dlopt "c") [result [
            vec3 getcloudshadow(vec3 pos)
            {
                if(cloudshadowstrength <= 0.0 || sunlightdir.z <= 1.0e-4) return vec3(1.0);

                vec3 relpos = pos - camera;
                float t = (cloudshadowparams.x - relpos.z) / sunlightdir.z;
                if(t <= 0.0) return vec3(1.0);

                vec2 projected = relpos.xy + sunlightdir.xy * t;
                float dist = length(projected);
                if(dist >= cloudshadowparams.w) return vec3(1.0);

                float fade = cloudshadowparams.z < cloudshadowparams.w ? 1.0 - smoothstep(cloudshadowparams.z, cloudshadowparams.w, dist) : 1.0;
                vec2 rotated = vec2(dot(projected, cloudshadowtransform.zw), projected.y*cloudshadowtransform.z - projected.x*cloudshadowtransform.w);
                vec2 tc = vec2(cloudshadowtransform.x - rotated.x * cloudshadowparams.y,
                               cloudshadowtransform.y + rotated.y * cloudshadowparams.y);
                float mask = clamp(texture2D(tex15, tc).a * cloudshadowstrength * fade, 0.0, 1.0);
                float shade = 1.0 - mask;
                return vec3(shade) * mix(vec3(1.0), cloudshadowcolor, mask);
            }
        ]])

        @(if (dlopt "p") [result [
            vec3 offsetshadowreceiver(vec3 dir, vec3 norm, float texelsize)
            {
                float cosine = clamp(dot(dir, norm)/max(length(dir), 1e-5), 0.0, 1.0);
                return dir - norm*(smreceiverbias.y*texelsize*sqrt(max(1.0-cosine*cosine, 0.0)));
            }

            float localshadowbias(vec4 params, float distance)
            {
                return smreceiverbias.x*abs(params.y)/(abs(params.x)*max(distance, 1e-5));
            }

            vec2 localshadowgradient(vec3 dir, vec3 norm, vec2 projectednormal, vec4 params)
            {
                float planeoffset = dot(dir, norm);
                return abs(planeoffset) > 0.001*length(dir)
                    ? projectednormal*(params.y/(params.x*planeoffset)) : vec2(0.0);
            }

            @(? $spotlight [
                vec3 getspottc(vec3 dir, vec3 norm, vec4 spotparams, vec4 shadowparams, vec2 shadowoffset, out vec2 gradient)
                {
                    float distance = dot(dir, spotparams.xyz);
                    dir = offsetshadowreceiver(dir, norm, max(distance, 0.0)/abs(shadowparams.x));
                    distance = max(dot(dir, spotparams.xyz), 1e-5);
                    float direction = spotparams.z > 0.0 ? 1.0 : -1.0;
                    vec2 projectednormal = norm.xy - spotparams.xy*(dot(norm, spotparams.xyz) + direction*norm.z)*shadowparams.z;
                    gradient = localshadowgradient(dir, norm, projectednormal, shadowparams);
                    vec2 xy = dir.xy - spotparams.xy*(distance + direction*dir.z)*shadowparams.z;
                    return vec3(xy*shadowparams.x/distance + shadowoffset,
                                shadowparams.y/distance + shadowparams.w - localshadowbias(shadowparams, distance));
                }
            ] [
                vec3 getshadowtc(vec3 dir, vec3 norm, vec4 shadowparams, vec2 shadowoffset, out vec2 gradient)
                {
                    vec3 adir = abs(dir);
                    float m = max(adir.x, adir.y);
                    float distance = max(max(adir.z, m), 1e-5);
                    dir = offsetshadowreceiver(dir, norm, distance/abs(shadowparams.x));
                    adir = abs(dir);
                    m = max(adir.x, adir.y);
                    distance = max(max(adir.z, m), 1e-5);
                    vec4 proj;
                    vec2 projectednormal;
                    if(adir.x > adir.y) { proj = vec4(dir.zyx, 0.0); projectednormal = norm.zy; }
                    else { proj = vec4(dir.xzy, 1.0); projectednormal = norm.xz; }
                    if(adir.z > m) { proj = vec4(dir, 2.0); projectednormal = norm.xy; }
                    gradient = localshadowgradient(dir, norm, projectednormal, shadowparams);
                    return vec3(proj.xy*shadowparams.x/distance + vec2(proj.w, step(0.0, proj.z))*shadowparams.z + shadowoffset,
                                shadowparams.y/distance + shadowparams.w - localshadowbias(shadowparams, distance));
                }
            ])
        ]])

        @(if (|| (dlopt "p") [dlopt "c"]) [
            cond [dlopt "G"] [
                smfilterg5 $colorshadow
            ] [dlopt "g"] [
                smfilterg3 $colorshadow
            ] [dlopt "E"] [
                smfilterb5 $colorshadow
            ] [dlopt "F"] [
                smfilterb3 $colorshadow
            ] [dlopt "f"] [
                smfilterb3 $colorshadow
            ] [
                smfilternone $colorshadow
            ]
        ])

        @(if (dlopt "p") [result [
            lightshadowtype softshadowcompare(vec3 tc)
            {
                @(? (|| (dlopt "g") (dlopt "G")) [
                    @(? (> $usetexgather 1) [
                        float visibility = float(shadow2D(tex4, vec3(tc.xy*shadowatlasscale, tc.z)));
                    ] [
                        vec2 fraction = fract(tc.xy - 0.5);
                        vec4 visible = step(tc.z, textureGather(tex4, tc.xy*shadowatlasscale));
                        float visibility = mix(mix(visible.w, visible.z, fraction.x),
                                               mix(visible.x, visible.y, fraction.x), fraction.y);
                    ])
                ] [
                    float visibility = float(shadow2DRect(tex4, tc));
                ])
                @(? (> $colorshadow 1) [
                    return visibility*filtercolorshadow(tex11, tc);
                ] [
                    return visibility;
                ])
            }

            lightshadowtype filterlocalshadow(vec3 dir, vec3 norm, vec3 tc, vec2 gradient, vec4 params,
                                              vec2 atlas, vec4 soft, vec4 spot)
            {
                if(soft.x <= 0.0) return filterlightshadow(tc, gradient);
                float receiver = length(dir);
                float radiuscap = 2.0*soft.y*abs(params.x);
                float radius = min(radiuscap, soft.x*abs(params.x)/max(receiver, 1e-5)*smoothstep(0.0, 0.25, receiver));
                if(radius < 0.5) return filterlightshadow(tc, gradient);

                @(? $spotlight [
                    float projecteddepth = max(dot(dir, spot.xyz), 0.0);
                ] [
                    float projecteddepth = max(max(abs(dir.x), abs(dir.y)), abs(dir.z));
                ])
                dir = offsetshadowreceiver(dir, norm, projecteddepth/abs(params.x));
                receiver = length(dir);
                float planeoffset = dot(dir, norm);
                if(planeoffset <= 0.001*receiver || receiver < 1e-5) return filterlightshadow(tc, gradient);

                vec3 axis = dir/receiver;
                vec3 tangent = normalize(cross(axis, abs(axis.z) < 0.9 ? vec3(0, 0, 1) : vec3(0, 1, 0)));
                vec3 bitangent = cross(axis, tangent);
                float spread = 0.5*radius/max(abs(params.x), 1.0);
                float count = clamp(soft.z, 1.0, 32.0);
                // Per-pixel Cranley-Patterson rotation and radial jitter break up the visible spiral rings. This runs only for soft-shadow lights and
                // retains one filtered comparison per configured sample.
                float noise = fract(52.9829189*fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))));
                float angle = noise*6.28318531;
                vec2 direction = vec2(cos(angle), sin(angle));
                lightshadowtype visibility = lightshadowtype(0.0);
                for(int i = 0; i < 32; ++i)
                {
                    if(float(i) >= count) break;
                    float radialjitter = fract(noise + float(i)*0.61803399);
                    vec2 disk = direction*sqrt((float(i)+radialjitter)/count);
                    direction = mat2(-0.73736888, 0.67549029, -0.67549029, -0.73736888)*direction;
                    vec3 ray = axis + spread*(tangent*disk.x + bitangent*disk.y);
                    float denominator = dot(ray, norm);
                    if(denominator <= 0.001)
                    {
                        visibility += softshadowcompare(tc);
                        continue;
                    }
                    ray *= planeoffset/denominator;
                    vec2 unusedgradient;
                    @(? $spotlight [
                        vec3 tap = getspottc(ray, vec3(0.0), spot, params, atlas, unusedgradient);
                        vec2 bounded = clamp(tap.xy, atlas - soft.w*0.5 + 0.5, atlas + soft.w*0.5 - 0.5);
                        tap.z += dot(bounded-tap.xy, gradient);
                        tap.xy = bounded;
                    ] [
                        vec3 tap = getshadowtc(ray, vec3(0.0), params, atlas, unusedgradient);
                    ])
                    visibility += softshadowcompare(tap);
                }
                visibility /= count;
                if(radius < 1.5) visibility = mix(filterlightshadow(tc, gradient), visibility, smoothstep(0.5, 1.5, radius));
                return visibility;
            }
        ]])

        @(if (dlopt "c") [result [
            sunshadowtype csmtap(vec3 tc, float layer, vec2 offset, vec2 gradient)
            {
                vec2 uv = (tc.xy + offset)*csmbiasparams.z;
                float visibility = csmcompare(vec4(uv, layer, tc.z + dot(offset, gradient)));
                @(? $colorshadow [
                    return visibility*csmcolor(vec3(uv, layer));
                ] [
                    return visibility;
                ])
            }

            sunshadowtype filtercsmpcf(vec3 tc, float layer, vec2 gradient)
            {
                if(csmpcfparams < 0.5) return csmtap(tc, layer, vec2(0.0), vec2(0.0));
                vec2 fraction = fract(tc.xy - 0.5);
                if(csmpcfparams > 1.5)
                {
                    vec3 wx = vec3(2.0-fraction.x, 2.0, 1.0+fraction.x);
                    vec3 wy = vec3(2.0-fraction.y, 2.0, 1.0+fraction.y);
                    vec3 ox = vec3(-2.0+1.0/wx.x, 0.5, 2.0+fraction.x/wx.z) - fraction.x;
                    vec3 oy = vec3(-2.0+1.0/wy.x, 0.5, 2.0+fraction.y/wy.z) - fraction.y;
                    sunshadowtype sum = sunshadowtype(0.0);
                    for(int y = 0; y < 3; ++y) for(int x = 0; x < 3; ++x)
                        sum += wx[x]*wy[y]*csmtap(tc, layer, vec2(ox[x], oy[y]), gradient);
                    return sum/25.0;
                }
                vec2 wx = vec2(2.0-fraction.x, 1.0+fraction.x);
                vec2 wy = vec2(2.0-fraction.y, 1.0+fraction.y);
                vec2 ox = vec2(1.0/wx.x-1.0, 2.0-1.0/wx.y) - fraction.x;
                vec2 oy = vec2(1.0/wy.x-1.0, 2.0-1.0/wy.y) - fraction.y;
                return (wx.x*wy.x*csmtap(tc, layer, vec2(ox.x, oy.x), gradient) +
                        wx.y*wy.x*csmtap(tc, layer, vec2(ox.y, oy.x), gradient) +
                        wx.x*wy.y*csmtap(tc, layer, vec2(ox.x, oy.y), gradient) +
                        wx.y*wy.y*csmtap(tc, layer, vec2(ox.y, oy.y), gradient))/9.0;
            }

            float csmblockerdepth(vec3 tc)
            {
                float depth = csmrawdepth(tc);
                @(? $colorshadow [depth = min(depth, csmtransdepth(tc));])
                return depth;
            }

            sunshadowtype filtercsmpcss(vec3 tc, float layer, vec2 gradient, vec4 depthparams, float cascade, float fade)
            {
                sunshadowtype base = filtercsmpcf(tc, layer, gradient);
                float texelsize = depthparams.z;
                float depthrange = -1.0/depthparams.x;
                float radiuscap = min(csmpcssparams.z/texelsize, csmpcssparams.w);
                float searchradius = min(radiuscap, max(tc.z, 0.0)*depthrange*csmpcssparams.x/texelsize);
                if(searchradius <= 0.5) return base;

                vec2 lo = vec2(0.5), hi = vec2(1.0/csmbiasparams.z - 0.5);
                vec2 footprint = floor(tc.xy - 0.5) + 0.5;
                float contactseparation = 1.0;
                bool contactblocker = false;
                for(int y = 0; y < 2; ++y) for(int x = 0; x < 2; ++x)
                {
                    vec2 sampletc = clamp(footprint + vec2(float(x), float(y)), lo, hi);
                    float stored = csmblockerdepth(vec3(sampletc*csmbiasparams.z, layer));
                    float delta = tc.z + dot(gradient, sampletc-tc.xy) - stored;
                    if(stored < 1.0 && delta > 0.0)
                    {
                        contactseparation = min(contactseparation, delta);
                        contactblocker = true;
                    }
                }
                if(contactblocker)
                    searchradius = min(searchradius, max(1.0, contactseparation*depthrange*csmpcssparams.x/texelsize));

                float budget = mix(1.0, 1.0/(1.0+cascade), csmpcssdistance.z)*mix(0.5, 1.0, fade);
                float searches = max(1.0, floor(csmpcsscounts.x*budget));
                float separation = contactblocker ? contactseparation : 0.0, blockers = contactblocker ? 1.0 : 0.0;
                float noise = fract(52.9829189*fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))));
                float angle = noise*6.28318531;
                vec2 ditherdirection = vec2(cos(angle), sin(angle));
                vec2 direction = ditherdirection;
                for(int i = 0; i < 32; ++i)
                {
                    if(float(i) >= searches) break;
                    vec2 disk = direction*sqrt((float(i)+0.5)/searches);
                    direction = mat2(-0.73736888, 0.67549029, -0.67549029, -0.73736888)*direction;
                    vec2 sampletc = floor(clamp(tc.xy + disk*searchradius, lo, hi)) + 0.5;
                    float stored = csmblockerdepth(vec3(sampletc*csmbiasparams.z, layer));
                    float delta = tc.z + dot(gradient, sampletc-tc.xy) - stored;
                    if(stored < 1.0 && delta > 0.0)
                    {
                        separation += delta;
                        blockers += 1.0;
                    }
                }
                if(blockers <= 0.0) return base;

                separation /= blockers;
                if(contactblocker) separation = min(separation, contactseparation);
                float penumbra = separation*depthrange*csmpcssparams.x/texelsize;
                float contactfade = smoothstep(0.5, 1.5, penumbra);
                if(contactfade <= 0.0) return base;
                float worldradius = clamp(penumbra*texelsize, csmpcssparams.y, csmpcssparams.z);
                float radius = min(worldradius/texelsize, radiuscap);

                float samples = max(1.0, floor(csmpcsscounts.y*budget));
                sunshadowtype filtered = sunshadowtype(0.0);
                direction = vec2(-ditherdirection.y, ditherdirection.x);
                for(int i = 0; i < 64; ++i)
                {
                    if(float(i) >= samples) break;
                    vec2 disk = direction*sqrt((float(i)+0.5)/samples);
                    direction = mat2(-0.73736888, 0.67549029, -0.67549029, -0.73736888)*direction;
                    vec2 sampletc = clamp(tc.xy + disk*radius, lo, hi);
                    filtered += csmtap(tc, layer, sampletc-tc.xy, gradient);
                }
                return mix(base, filtered/samples, contactfade*fade);
            }

            sunshadowtype samplecsm(int cascade, vec3 pos, vec3 norm)
            {
                vec4 transform = csmtransform[cascade], depthparams = csmdepth[cascade];
                float cosine = clamp(dot(norm, sunlightdir), 0.0, 1.0);
                float normaloffset = csmbiasparams.y*depthparams.z*sqrt(max(1.0-cosine*cosine, 0.0));
                vec3 lightpos = csmmatrix*(pos + norm*normaloffset);
                vec3 tc = vec3(lightpos.xy*transform.z + transform.xy, lightpos.z*depthparams.x + depthparams.y);
                tc.z += csmbiasparams.x*depthparams.z*depthparams.x;
                if(any(lessThan(tc, vec3(0.0))) || any(greaterThan(tc, vec3(1.0)))) return sunshadowtype(1.0);
                tc.xy /= csmbiasparams.z;

                vec3 lightnormal = csmmatrix*norm;
                vec2 gradient = abs(lightnormal.z) > 0.001
                    ? -lightnormal.xy/lightnormal.z*(depthparams.x*depthparams.z) : vec2(0.0);
                float fade = csmpcssparams.x > 0.0
                    ? clamp((csmpcssdistance.x-length(pos))*csmpcssdistance.y, 0.0, 1.0) : 0.0;
                if(fade <= 0.0) return filtercsmpcf(tc, transform.w, gradient);
                return filtercsmpcss(tc, transform.w, gradient, depthparams, float(cascade), fade);
            }

            sunshadowtype getcsmshadow(vec3 pos, vec3 norm, out vec3 debugcolor)
            {
                const int cascadecount = @(+ $numsplits 0);
                float viewdepth = dot(pos, csmviewdir);
                int cascade = 0;
                @(? (dlopt "m") [
                    viewdepth = 0.0;
                ] [
                    for(int i = 1; i < cascadecount; ++i)
                        if(viewdepth > csmdistances[i-1].y) cascade = i;
                ])
                vec2 distances = csmdistances[cascade];
                float blend = distances.y > distances.x ? smoothstep(distances.x, distances.y, viewdepth) : 0.0;
                debugcolor = 0.5 + 0.5*cos(vec3(0.0, 2.094, 4.189) + float(cascade)*2.4);
                debugcolor = mix(debugcolor, vec3(1.0), blend);
                if(csmbiasparams.w > 1.5) debugcolor = blend > 0.0 ? vec3(1.0, 0.5, 0.0) : vec3(0.12);
                if(viewdepth > csmdistances[cascadecount-1].y)
                {
                    debugcolor = vec3(0.1);
                    return sunshadowtype(1.0);
                }
                sunshadowtype visibility = samplecsm(cascade, pos, norm);
                if(blend > 0.0)
                {
                    sunshadowtype next = sunshadowtype(1.0);
                    if(cascade < cascadecount-1) next = samplecsm(cascade+1, pos, norm);
                    visibility = mix(visibility, next, blend);
                }
                return visibility;
            }

            @(if (dlopt "r") [result [
                vec4 getrhlight(vec3 pos, vec3 norm)
                {
                    vec3 tc;
                    float offset;
                    pos += norm*rhnudge;
                    @(loopconcat j $numrh [result [
                        tc = rhtc[@@j].xyz + pos*rhtc[@@j].w;
                        offset = @(divf (+f 0.5 $j) $numrh);
                        if(max(max(abs(tc.x), abs(tc.y)), abs(tc.z)) >= rhbounds)
                        {
                    ]])
                            tc = vec3(4.0);
                    @(loopconcat j $numrh [result [
                        }
                    ]])
                    tc.xy += 0.5;
                    tc.z = tc.z * @(divf 1 $numrh) + offset;
                    vec4 shr = texture3D(tex6, tc), shg = texture3D(tex7, tc), shb = texture3D(tex8, tc), sha = texture3D(tex9, tc);
                    shr.rgb -= 0.5;
                    shg.rgb -= 0.5;
                    shb.rgb -= 0.5;
                    sha.rgb -= 0.5;
                    vec4 basis = vec4(norm*-(1.023326*0.488603/3.14159*2.0), (0.886226*0.282095/3.14159));
                    return clamp(vec4(dot(basis, shr), dot(basis, shg), dot(basis, shb), min(dot(basis, sha), norm.z + 1.0)), 0.0, 1.0);
                }
            ]])
        ]])

        void main(void)
        {
            @(if (dlopt "M") [
                if (dlopt "R") [result [
                    @(if (dlopt "T") [result [
                        bool shouldresolve = true;
                        @(msaadetectedges [shouldresolve = false;])
                    ]])

                    #define gfetch(sampler, coords) texelFetch(sampler, ivec2(coords), sampleidx)

                    vec4 resolved = vec4(0.0);
                    #define accumlight(light) resolved.rgb += light
                    #define accumalpha(alpha) resolved.a += alpha

                    @(if (&& [dlopt "a"] [! $avatar] [! $transparent]) [result [
                        float ao = texture2DRect(tex5, gl_FragCoord.xy*aoscale).r;
                    ]])

                    for(int sampleidx = 0; sampleidx < @msaasamples; sampleidx++) 
                    {
                ]] [result [
                    @(if (dlopt "T") [msaadetectedges [discard;]])

                    #define gfetch(sampler, coords) texelFetch(sampler, ivec2(coords), @(? (dlopt "S") [gl_SampleID] (? (dlopt "O") 1 0)))

                    #define accumlight(light) fragcolor.rgb = light
                    #define accumalpha(alpha) fragcolor.a = alpha
                ]]
            ] [result [
                #define gfetch(sampler, coords) texture2DRect(sampler, coords)

                #define accumlight(light) fragcolor.rgb = light
                #define accumalpha(alpha) fragcolor.a = alpha
            ]])

            @(if (|| $baselight [> $numlights 1]) [result [
                vec4 normal = gfetch(tex1, gl_FragCoord.xy);

                @(if $transparent [result [
                    @(? (! $ghasstencil) [
                        if(normal.x + normal.y == 0.0) discard;
                    ])

                    normal.xyz = normal.xyz*2.0 - 1.0;
                    @(if $usepacknorm [result [
                        float alpha = dot(normal.xyz, normal.xyz);
                        normal.xyz *= inversesqrt(alpha);
                        @(if $baselight [unpacknorm alpha])
                    ]] [result [
                        #define alpha normal.a
                    ]])

                    vec4 diffuse = gfetch(tex0, gl_FragCoord.xy);
                    @(? $baselight [
                        vec3 glow = gfetch(tex2, gl_FragCoord.xy).rgb;
                    ])
                ]] [result [
                    @(? $baselight [
                        float alpha = float(normal.x + normal.y != 0.0);
                    ] [
                        #define alpha 1.0
                    ])

                    normal.xyz = normal.xyz*2.0 - 1.0;
                    @(if $usepacknorm [result [
                        float glowscale = dot(normal.xyz, normal.xyz);
                        normal.xyz *= inversesqrt(glowscale);
                        @(unpacknorm glowscale)
                    ]] [result [
                        #define glowscale normal.a
                    ]])

                    vec4 diffuse = gfetch(tex0, gl_FragCoord.xy);
                    @(? $baselight [
                        vec3 glow = diffuse.rgb * (1.0 - glowscale);
                    ])
                    diffuse.rgb *= glowscale;
                ]])
            ]])

            @(if (dlopt "m") [if (+ $numlights (dlopt "c")) [
                gdepthunpackortho depth [gfetch(tex3, gl_FragCoord.xy)] [
                    vec3 pos = (worldmatrix * vec4(gl_FragCoord.xy, depth, 1.0)).xyz;
                    @(? (|| (dlopt "p") [dlopt "c"]) [
                        vec3 shadowpos = (shadowworldmatrix * vec4(gl_FragCoord.xy, depth, 1.0)).xyz;
                    ])
                ]
            ]] [if (+ $numlights (dlopt "c")) [result [
                @(gdepthunpack depth [gfetch(tex3, gl_FragCoord.xy)] [
                    vec3 pos = (worldmatrix * vec4(depth*gl_FragCoord.xy, depth, 1.0)).xyz;
                    @(? (|| (dlopt "p") [dlopt "c"]) [
                        vec3 shadowpos = (shadowworldmatrix * vec4(depth*gl_FragCoord.xy, depth, 1.0)).xyz;
                    ])
                ] [
                    vec4 pos = worldmatrix * vec4(gl_FragCoord.xy, depth, 1.0);
                    pos.xyz /= pos.w;
                    @(? (|| (dlopt "p") [dlopt "c"]) [
                        vec4 shadowpos = shadowworldmatrix * vec4(gl_FragCoord.xy, depth, 1.0);
                        shadowpos.xyz /= shadowpos.w;
                    ])
                ])
                @(? (|| $baselight [> $numlights 1]) [
                    float fogcoord = length(camera - pos.xyz);
                ])
                @(if (> (+ $numlights (dlopt "c")) 1) [unpackspec])
            ]] [result [
                @(gdepthunpack depth [gfetch(tex3, gl_FragCoord.xy)])
                @(? $baselight [
                    float fogcoord = -depth*length(vec3(gl_FragCoord.xy*radialfogscale.xy + radialfogscale.zw, 1.0));
                ])
            ]]])

            @(? (dlopt "p") [
                vec3 localshadownormal = cross(dFdx(shadowpos.xyz), dFdy(shadowpos.xyz));
                float localnormalarea = dot(localshadownormal, localshadownormal);
                localshadownormal *= inversesqrt(max(localnormalarea, 1e-12));
            ])

            @(if $baselight [result [
                vec3 light = lightscale.rgb;
                @(? (dlopt "r") [
                    vec4 rhlight = getrhlight(pos.xyz, normal.xyz); 
                    light += rhlight.a * skylightcolor;
                ])
                light *= diffuse.rgb;

                @(if (&& (dlopt "a") [! $avatar] [! $transparent]) [result [
                    @(? (! (&& (dlopt "M") [dlopt "R"])) [
                        float ao = texture2DRect(tex5, gl_FragCoord.xy*aoscale).r;
                    ])
                    @(if (dlopt "d") [result [
                        #define aomask ao
                    ]] [result [
                        float avatarmask = step(fogcoord, @avatarshadowdist) * @(? $msaasamples [step(0.75, normal.a)] [normal.a]);
                        float aomask = clamp(ao + avatarmask, 0.0, 1.0);
                    ]])
                    light *= aoparams.x + aomask*aoparams.y;
                ]])
                light += glow * lightscale.a;
            ]] [result [
                vec3 light = vec3(0.0);
            ]])

            @(if (dlopt "c") [result [
                @(? (dlopt "r") [
                    vec3 sunlight = rhlight.rgb * giscale * diffuse.rgb;
                ])
                vec3 surfacenormal = cross(dFdx(shadowpos.xyz), dFdy(shadowpos.xyz));
                float surfacelength = dot(surfacenormal, surfacenormal);
                surfacenormal = surfacelength > 1e-12 ? surfacenormal*inversesqrt(surfacelength) : normal.xyz;
                if(dot(surfacenormal, normal.xyz) < 0.0) surfacenormal = -surfacenormal;
                vec3 csmdebugcolor = vec3(0.0);
                float sunfacing = dot(sunlightdir, normal.xyz);
                sunshadowtype csmvisibility = sunshadowtype(1.0);
                if(sunfacing > 0.0 || csmbiasparams.w > 0.5)
                    csmvisibility = getcsmshadow(shadowpos.xyz, surfacenormal, csmdebugcolor);
                if(sunfacing > 0.0)
                {
                    sunshadowtype sunoccluded = csmvisibility;
                    vec3 cloudshadow = getcloudshadow(pos.xyz);
                    @(if (dlopt "m") [result [
                        light += diffuse.rgb*sunfacing * sunlightcolor * sunoccluded * cloudshadow;
                    ]] [result [
                        @(if (= (+ $numlights (dlopt "c")) 1) [unpackspec])
                        float sunspec = pow(clamp(sunfacing*facing - dot(camdir, sunlightdir), 0.0, 1.0), gloss) * specscale;
                        @(if (dlopt "r") [result [
                            sunlight += (diffuse.rgb*sunfacing + sunspec) * sunoccluded * cloudshadow;
                        ]] [result [
                            @(? (&& (dlopt "A") [! $avatar] [! $transparent]) [
                                sunoccluded *= aoparams.z + aomask*aoparams.w;
                            ])
                            light += (diffuse.rgb*sunfacing + sunspec) * sunoccluded * cloudshadow * sunlightcolor;
                        ]])
                    ]])
                }
                @(if (dlopt "r") [result [
                    @(? (&& (dlopt "A") [! $avatar] [! $transparent]) [
                        sunlight *= aoparams.z + aomask*aoparams.w;
                    ])
                    light += sunlight * sunlightcolor;
                ]])
                if(csmbiasparams.w > 0.5) light = mix(light, csmdebugcolor*lightscale.a, 0.65);
            ]])

            @(loopconcat j $numlights [result [
                vec3 light@[j]dir = lightpos[@@j].xyz - @(? (dlopt "p") [shadowpos.xyz] [pos.xyz]) * lightpos[@@j].w;
                float light@[j]dist2 = dot(light@[j]dir, light@[j]dir);
                if(light@[j]dist2 < 1.0)
                {
                    @(if (= (+ $numlights $baselight) 1) [result [
                        vec4 normal = gfetch(tex1, gl_FragCoord.xy);
                        @(? (&& $transparent [! $ghasstencil]) [
                            if(normal.x + normal.y == 0.0) discard;
                        ])
                        normal.xyz = normal.xyz*2.0 - 1.0;
                        @(? $usepacknorm [
                            float glowscale = dot(normal.xyz, normal.xyz);
                            normal.xyz *= inversesqrt(glowscale);
                        ] [
                            #define glowscale normal.a
                        ])
                    ]])
                    @(? (dlopt "p") [
                        vec3 receivernormal = localnormalarea > 1e-12 ? localshadownormal : normal.xyz;
                        if(dot(receivernormal, normal.xyz) < 0.0) receivernormal = -receivernormal;
                        vec2 depthgradient;
                    ])
                    float light@[j]facing = dot(light@[j]dir, normal.xyz);
                    if(light@[j]facing > 0.0)
                    {
                        float light@[j]invdist = inversesqrt(light@[j]dist2); 
                        @(if $spotlight [result [
                            float spot@[j]dist = dot(light@[j]dir, spotparams[@@j].xyz);
                            float spot@[j]atten = 1.0 - (1.0 - light@[j]invdist * spot@[j]dist) * spotparams[@@j].w;
                            if(spot@[j]atten > 0.0)
                            {
                        ]])
                        float light@[j]atten = 1.0 - light@[j]dist2 * light@[j]invdist;
                        @(? (&& (= (+ $numlights $baselight) 1) [! (dlopt "m")]) [
                            float fogcoord = length(camera - pos.xyz);
                        ])
                        @(if $spotlight [
                            if (dlopt "p") [result [
                                vec3 spot@[j]tc = getspottc(light@[j]dir, receivernormal, spotparams[@@j], shadowparams[@@j],
                                                          shadowoffset[@@j], depthgradient);
                                lightshadowtype light@[j]shadow = light@[j]atten * spot@[j]atten * filterlocalshadow(light@[j]dir,
                                    receivernormal, spot@[j]tc, depthgradient, shadowparams[@@j], shadowoffset[@@j], shadowsoft[@@j], spotparams[@@j]);
                            ]] [result [
                                float light@[j]shadow = light@[j]atten * spot@[j]atten;
                            ]]
                        ] [
                            if (dlopt "p") [result [
                                vec3 shadow@[j]tc = getshadowtc(light@[j]dir, receivernormal, shadowparams[@@j], shadowoffset[@@j], depthgradient);
                                lightshadowtype light@[j]shadow = light@[j]atten * filterlocalshadow(light@[j]dir,
                                    receivernormal, shadow@[j]tc, depthgradient, shadowparams[@@j], shadowoffset[@@j], shadowsoft[@@j], vec4(0.0));
                            ]] [result [
                                #define light@[j]shadow light@[j]atten
                            ]]
                        ])
                        @(if (= (+ $numlights $baselight) 1) [result [
                            vec4 diffuse = gfetch(tex0, gl_FragCoord.xy);
                            @(if (! $transparent) [result [
                                @(if $usepacknorm [unpacknorm glowscale])
                                diffuse.rgb *= glowscale;
                            ]])
                        ]])
                        light@[j]facing *= light@[j]invdist;
                        @(if (dlopt "m") [result [
                            light += diffuse.rgb*light@[j]facing * lightcolor[@@j].rgb * light@[j]shadow;
                        ]] [result [
                            @(if (= (+ $numlights (dlopt "c")) 1) [unpackspec])
                            float light@[j]spec = pow(clamp(light@[j]facing*facing - light@[j]invdist*dot(camdir, light@[j]dir), 0.0, 1.0), gloss) * specscale;
                            @(if (dlopt "z") [result [
                                light@[j]spec *= lightcolor[@@j].a;
                            ]]) 
                            light += (diffuse.rgb*light@[j]facing + light@[j]spec) * lightcolor[@@j].rgb * light@[j]shadow;
                            @(? (= (+ $numlights $baselight) 1) [
                                float foglerp = clamp(exp2(fogcoord*fogdensity.x)*fogdensity.y, 0.0, 1.0);
                                light *= foglerp;
                            ])
                        ]])
                        @(? $spotlight [}])
                    }
                }
            ]])
            @(if (dlopt "m") [if $baselight [result [
                accumlight(light);
                accumalpha(alpha);
            ]] [result [
                accumlight(light);
                accumalpha(0.0);
            ]]] [if (|| $baselight [> $numlights 1]) [result [
                float foglerp = clamp(exp2(fogcoord*fogdensity.x)*fogdensity.y, 0.0, 1.0);
                @(? $baselight [
                    accumlight(mix(fogcolor*alpha, light, foglerp));
                    accumalpha(alpha);
                ] [
                    accumlight(light*foglerp);
                    accumalpha(0.0);
                ])
            ]] [result [
                accumlight(light);
                accumalpha(0.0);
            ]]])

            @(if (dlopt "R") [result [
                    @(? (dlopt "T") [if(!shouldresolve) break;])
                }

                @(? (dlopt "T") [if(shouldresolve)]) resolved *= @(divf 1 $msaasamples);
                fragcolor = resolved;
            ]])
        }
    ] $arg7
]

deferredlightshader = [
    deferredlighttype = (concatword $arg1 $arg2 $arg3)
    shadername = (concatword "deferredlight" $deferredlighttype)
    basevariants = (* (max $arg6 1) 2 (? (dlopt "b") 2 1) (? (dlopt "s") 2 1))
    maxvariants = $basevariants
    if (dlopt "t") [maxvariants = (+ $maxvariants $basevariants 1)]
    if (dlopt "d") [maxvariants = (+ $maxvariants $basevariants 1)]
    if (dlopt "P") [maxvariants = (+ $maxvariants (* (max $arg6 1) (? (dlopt "s") 2 1)))]
    deferredlightvariantshader $shadername -1 $arg1 $arg4 $arg5 0 $maxvariants // null base shader
    deferredlightvariantshader $shadername 0 (concatword $arg1 $arg3) $arg4 $arg5 0 $maxvariants // row 0, base shader, sunlight
    if (dlopt "t") [
        deferredlightvariantshader $shadername 8 (concatword $arg1 $arg3) $arg4 $arg5 0 $maxvariants // row 8, transparency, base shader, sunlight
    ]
    if (dlopt "d") [
        deferredlightvariantshader $shadername 24 (concatword $arg1 $arg3) $arg4 $arg5 0 $maxvariants // row 24, avatar, base shader, sunlight
    ]
    loop+ i 1 (max $arg6 1) [
        if (dlopt "b") [
            deferredlightvariantshader $shadername 0 (concatword $arg1 $arg3) $arg4 $arg5 $i $maxvariants // row 0, point lights, sunlight
            deferredlightvariantshader $shadername 1 (concatword $arg1 $arg2 $arg3) $arg4 $arg5 $i $maxvariants // row 1, shadowed point lights, sunlight
        ]
        deferredlightvariantshader $shadername 2 $arg1 $arg4 $arg5 $i $maxvariants // row 2, point lights 
        deferredlightvariantshader $shadername 3 (concatword $arg1 $arg2) $arg4 $arg5 $i $maxvariants // row 3, shadowed point lights
        if (dlopt "s") [
            if (dlopt "b") [
                deferredlightvariantshader $shadername 4 (concatword $arg1 $arg3) $arg4 $arg5 $i $maxvariants // row 4, spot lights, sunlight
                deferredlightvariantshader $shadername 5 (concatword $arg1 $arg2 $arg3) $arg4 $arg5 $i $maxvariants // row 5, shadowed spot lights, sunlight
            ]
            deferredlightvariantshader $shadername 6 $arg1 $arg4 $arg5 $i $maxvariants // row 6, spot lights 
            deferredlightvariantshader $shadername 7 (concatword $arg1 $arg2) $arg4 $arg5 $i $maxvariants // row 7, shadowed spot lights
        ]
        if (dlopt "t") [
            if (dlopt "b") [
                deferredlightvariantshader $shadername 8 (concatword $arg1 $arg3) $arg4 $arg5 $i $maxvariants // row 8, transparent, point lights, sunlight
                deferredlightvariantshader $shadername 9 (concatword $arg1 $arg2 $arg3) $arg4 $arg5 $i $maxvariants // row 9, transparent, shadowed point lights, sunlight
            ]
            deferredlightvariantshader $shadername 10 $arg1 $arg4 $arg5 $i $maxvariants // row 10, transparent, point lights 
            deferredlightvariantshader $shadername 11 (concatword $arg1 $arg2) $arg4 $arg5 $i $maxvariants // row 11, transparent, shadowed point lights
            if (dlopt "s") [
                if (dlopt "b") [
                    deferredlightvariantshader $shadername 12 (concatword $arg1 $arg3) $arg4 $arg5 $i $maxvariants // row 12, transparent, spot lights, sunlight
                    deferredlightvariantshader $shadername 13 (concatword $arg1 $arg2 $arg3) $arg4 $arg5 $i $maxvariants // row 13, transparent, shadowed spot lights, sunlight
                ]
                deferredlightvariantshader $shadername 14 $arg1 $arg4 $arg5 $i $maxvariants // row 14, transparent, spot lights 
                deferredlightvariantshader $shadername 15 (concatword $arg1 $arg2) $arg4 $arg5 $i $maxvariants // row 15, transparent, shadowed spot lights
            ]
        ]
        if (dlopt "P") [
            if (dlopt "b") [
                deferredlightvariantshader $shadername 17 (concatword $arg1 $arg2 $arg3) $arg4 $arg5 $i $maxvariants // row 17, color shadow, shadowed point lights, sunlight
            ]
            deferredlightvariantshader $shadername 19 (concatword $arg1 $arg2) $arg4 $arg5 $i $maxvariants // row 19, color shadow, shadowed point lights
            if (dlopt "s") [
                if (dlopt "b") [
                    deferredlightvariantshader $shadername 21 (concatword $arg1 $arg2 $arg3) $arg4 $arg5 $i $maxvariants // row 21, color shadow, shadowed spot lights, sunlight
                ]
                deferredlightvariantshader $shadername 23 (concatword $arg1 $arg2) $arg4 $arg5 $i $maxvariants // row 23, color shadow, shadowed spot lights
            ]
        ]
        if (dlopt "d") [
            if (dlopt "b") [
                deferredlightvariantshader $shadername 24 (concatword $arg1 $arg3) $arg4 $arg5 $i $maxvariants // row 24, avatar, point lights, sunlight
                deferredlightvariantshader $shadername 25 (concatword $arg1 $arg2 $arg3) $arg4 $arg5 $i $maxvariants // row 25, avatar, shadowed point lights, sunlight
            ]
            deferredlightvariantshader $shadername 26 $arg1 $arg4 $arg5 $i $maxvariants // row 26, avatar, point lights 
            deferredlightvariantshader $shadername 27 (concatword $arg1 $arg2) $arg4 $arg5 $i $maxvariants // row 27, avatar, shadowed point lights
            if (dlopt "s") [
                if (dlopt "b") [
                    deferredlightvariantshader $shadername 28 (concatword $arg1 $arg3) $arg4 $arg5 $i $maxvariants // row 28, avatar, spot lights, sunlight
                    deferredlightvariantshader $shadername 29 (concatword $arg1 $arg2 $arg3) $arg4 $arg5 $i $maxvariants // row 29, avatar, shadowed spot lights, sunlight
                ]
                deferredlightvariantshader $shadername 30 $arg1 $arg4 $arg5 $i $maxvariants // row 30, avatar, spot lights 
                deferredlightvariantshader $shadername 31 (concatword $arg1 $arg2) $arg4 $arg5 $i $maxvariants // row 31, avatar, shadowed spot lights
            ]
        ]
    ]
]
